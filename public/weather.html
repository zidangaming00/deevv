<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deevv SERP Weather Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
  
  <style>
    /* Variabel Identitas Deevv */
    :root {
      --brand: #1558D6;
      --brand-50: #E8F0FE;
      --brand-100: #D2E3FC;
      --surface: #ffffff;
      --card-bg-alt: #f0f4f9;
      --text: #101518;
      --text-muted: #70757a;
      --line: #EDEDED;
      --aqi-good-bg: #e6f4ea;
      --aqi-good-text: #137333;
      --chart-fill: rgba(254, 224, 130, 0.55);
      --chart-line: #f9ab00;
      --font: 'Google Sans Flex', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --brand: #8ab4f8;
      --brand-50: #1f2d4a;
      --brand-100: #2b4a80;
      --surface: #202125;
      --card-bg-alt: #26282c;
      --text: #E9EAEE;
      --text-muted: #9BA0A6;
      --line: #3C4043;
      --aqi-good-bg: #0c2d1c;
      --aqi-good-text: #81c995;
      --chart-fill: rgba(249, 171, 0, 0.25);
      --chart-line: #fdd663;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    /* Outer Wrapper untuk SERP Result Card */
    .serp-weather-card {
      width: 100%;
      max-width: 580px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 1px 6px rgba(32,33,36,0.08);
    }

    /* Header Section */
    .serp-header h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .serp-subhead {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 2px;
      margin-bottom: 16px;
    }

    /* Temperature & Unit Switch */
    .temp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .temp-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .weather-icon-large {
      width: 48px;
      height: 48px;
      color: var(--brand);
    }

    .temp-number {
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
    }

    .unit-switch {
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
    }

    .unit-switch span { cursor: pointer; }
    .unit-switch span.active {
      color: var(--text);
      font-weight: 700;
    }

    /* Sunrise, Sunset, AQI Meta Info */
    .meta-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 20px;
    }

    .meta-info span strong { font-weight: 600; }

    .aqi-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .aqi-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--aqi-good-bg);
      color: var(--aqi-good-text);
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .aqi-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--aqi-good-text);
    }

    /* Filter Tabs (Pill Buttons) */
    .tab-pills {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tab-btn {
      border: 1px solid var(--line);
      background: var(--card-bg-alt);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      border-color: var(--brand);
      background: var(--surface);
      color: var(--brand);
      font-weight: 600;
      box-shadow: 0 0 0 1px var(--brand);
    }

    /* Area Chart Canvas Container */
    .chart-container {
      width: 100%;
      height: 120px;
      position: relative;
      margin-bottom: 24px;
    }

    canvas#weatherChart {
      width: 100%;
      height: 100%;
    }

    /* Horizontal Forecast List */
    .forecast-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--line);
    }

    .forecast-card {
      flex: 1;
      min-width: 80px;
      background: transparent;
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      cursor: pointer;
    }

    .forecast-card.active {
      background: var(--brand-50);
    }

    .forecast-day {
      font-size: 14px;
      font-weight: 600;
    }

    .forecast-icon {
      width: 28px;
      height: 28px;
    }

    .forecast-temp {
      font-size: 13px;
      color: var(--text);
      display: flex;
      gap: 6px;
    }

    .forecast-temp .min {
      color: var(--text-muted);
    }

    /* Footer Credits */
    .serp-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .serp-footer a {
      color: var(--brand);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="serp-weather-card">
    <!-- Header info lokasi -->
    <div class="serp-header">
      <h2 id="cityName">South Tangerang, Banten, ID</h2>
      <div class="serp-subhead" id="subHead">Rabu, 14 Oktober · Berawan · Kelembapan: 74%</div>
    </div>

    <!-- Suhu utama dan switch Fahrenheit / Celsius -->
    <div class="temp-row">
      <div class="temp-main">
        <svg class="weather-icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <div class="temp-number" id="currentTemp">28°</div>
      </div>
      <div class="unit-switch">
        <span>Fahrenheit</span>
        <span class="active">Celsius</span>
      </div>
    </div>

    <!-- Sunrise, Sunset & AQI -->
    <div class="meta-info">
      <div>Matahari terbit: <strong>05:32</strong></div>
      <div>Matahari terbenam: <strong>17:46</strong></div>
      <div class="aqi-row">
        <span>AQI</span>
        <div class="aqi-badge">
          <span class="aqi-dot"></span>
          <span>Baik</span>
        </div>
      </div>
    </div>

    <!-- Pill Tabs -->
    <div class="tab-pills">
      <button class="tab-btn active">Temperature</button>
      <button class="tab-btn">Precipitation</button>
      <button class="tab-btn">Wind</button>
    </div>

    <!-- Graphic Curve Canvas -->
    <div class="chart-container">
      <canvas id="weatherChart"></canvas>
    </div>

    <!-- 4-Day Forecast Cards -->
    <div class="forecast-row">
      <div class="forecast-card active">
        <span class="forecast-day">Rabu</span>
        <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <div class="forecast-temp">
          <span>37°</span>
          <span class="min">28°</span>
        </div>
      </div>

      <div class="forecast-card">
        <span class="forecast-day">Kamis</span>
        <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <div class="forecast-temp">
          <span>37°</span>
          <span class="min">28°</span>
        </div>
      </div>

      <div class="forecast-card">
        <span class="forecast-day">Jumat</span>
        <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>
          <path d="M8 19v2M12 19v2M16 19v2"/>
        </svg>
        <div class="forecast-temp">
          <span>36°</span>
          <span class="min">27°</span>
        </div>
      </div>

      <div class="forecast-card">
        <span class="forecast-day">Sabtu</span>
        <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>
          <path d="M8 19v2M12 19v2M16 19v2"/>
        </svg>
        <div class="forecast-temp">
          <span>36°</span>
          <span class="min">27°</span>
        </div>
      </div>
    </div>

    <!-- Footer SERP -->
    <div class="serp-footer">
      <span>Powered by <a href="#">OpenWeatherMap</a></span>
      <a href="#">Masukan</a>
    </div>
  </div>

  <script>
    // Canvas Custom Spline/Area Chart Drawing
    function drawWeatherChart() {
      const canvas = document.getElementById('weatherChart');
      const ctx = canvas.getContext('2d');
      
      // Handle High-DPI screens
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const hours = ["07:00", "13:00", "19:00", "01:00", "07:00"];
      const temps = [28, 34, 32, 29, 31];

      const paddingX = 30;
      const width = rect.width - paddingX * 2;
      const height = rect.height - 35; // Reserve space for bottom time labels

      const minTemp = 25;
      const maxTemp = 36;

      const points = temps.map((t, index) => {
        const x = paddingX + (index / (temps.length - 1)) * width;
        const y = height - ((t - minTemp) / (maxTemp - minTemp)) * (height - 20) - 10;
        return { x, y, temp: t, time: hours[index] };
      });

      // Clear Canvas
      ctx.clearRect(0, 0, rect.width, rect.height);

      // Draw Filled Area Below Curve
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 0; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.lineTo(points[points.length - 1].x, height + 5);
      ctx.lineTo(points[0].x, height + 5);
      ctx.closePath();

      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-fill').trim();
      ctx.fill();

      // Draw Curve Line
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 0; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim();
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Draw Temperature Labels & Time Text
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
      ctx.font = '500 12px Google Sans Flex, sans-serif';
      ctx.textAlign = 'center';

      points.forEach(p => {
        // Temp text above point
        ctx.fillText(`${p.temp}`, p.x, p.y - 8);

        // Time text at the bottom
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
        ctx.fillText(p.time, p.x, height + 24);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
      });
    }

    window.addEventListener('load', drawWeatherChart);
    window.addEventListener('resize', drawWeatherChart);
  </script>
</body>
</html>

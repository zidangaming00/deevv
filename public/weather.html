<style>

 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2m-15.07-7.07 1.41 1.41m11.32 11.32 1.41 1.41m0-14.14-1.41 1.41M6.34 17.66l-1.41 1.41"/>',
 moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
 cloud:'<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
 csun:'<path d="M12 2v2M4.93 4.93l1.41 1.41M20 12h2m-2.93-7.07-1.41 1.41M15.95 12.65a4 4 0 0 0-5.93-4.13"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6Z"/>',
 cmoon:'<path d="M10.19 8.5A6 6 0 0 1 16 4a1 1 0 0 0 6 6 6 6 0 0 1-3 5.2"/><path d="M13 16a3 3 0 1 1 0 6H7a5 5 0 1 1 4.9-6Z"/>',
 rain:'<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M16 14v6M8 14v6M12 16v6"/>',
 drizzle:'<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M8 19v1M8 14v1M16 19v1M16 14v1M12 21v1M12 16v1"/>',
 snow:'<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/>',
 storm:'<path d="M6 16.33A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 .5 8.97"/><path d="m13 12-3 5h4l-3 5"/>',
 fog:'<path d="M4 14.9A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.24M16 17H7M17 21H9"/>',
 drop:'<path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/>',
 wind:'<path d="M12.8 19.6A2 2 0 1 0 14 16H2M17.5 8a2.5 2.5 0 1 1 2 4H2M9.8 4.4A2 2 0 1 1 11 8H2"/>',
 therm:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/>',
 gauge:'<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
 rise:'<path d="M12 2v8M4.93 10.93l1.41 1.41M2 18h2M20 18h2m-2.93-7.07-1.41 1.41M22 22H2M8 6l4-4 4 4M16 18a4 4 0 0 0-8 0"/>',
 set:'<path d="M12 10V2M4.93 10.93l1.41 1.41M2 18h2M20 18h2m-2.93-7.07-1.41 1.41M22 22H2M16 5l-4 4-4-4M16 18a4 4 0 0 0-8 0"/>',
 pin:'<path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
 mark:'<path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
 x:'<path d="M18 6 6 18M6 6l12 12"/>',
 locate:'<path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/>'
};
const svg = (k, c='') => `<svg viewBox="0 0 24 24" class="${c}" aria-hidden="true">${P[k]}</svg>`;
function wx(code, day) {
  if (code === 0 || code === 1) return day ? ['sun','clear'] : ['moon','night'];
  if (code === 2) return [day ? 'csun' : 'cmoon', day ? 'cloud' : 'night'];
  if (code === 3) return ['cloud','cloud'];
  if (code === 45 || code === 48) return ['fog','cloud'];
  if (code >= 51 && code <= 57) return ['drizzle','rain'];
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ['rain','rain'];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['snow','snow'];
  return ['storm','storm'];
}
const wtext = c => L.w[c] || L.w[{48:45,56:51,57:53,66:61,67:63,77:71,85:80,86:82}[c]] || L.w[c >= 95 ? 95 : 3];

const KEY = 'deevv-weather-v1', $ = id => document.getElementById(id);
let S = { places: [], cur: { n: 'Jakarta', c: 'Indonesia', lat: -6.2088, lon: 106.8456 }, unit: 'c' }, data = null;
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (_) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = m => { const e = $('toast'); e.textContent = m; e.classList.add('show'); clearTimeout(toast.id); toast.id = setTimeout(() => e.classList.remove('show'), 2000); };
const isSaved = p => S.places.some(x => x.lat === p.lat && x.lon === p.lon);
const deg = n => Math.round(n);

function i18n() {
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.documentElement.lang = ID ? 'id' : 'en';
}
function tab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.dataset.page === name));
  document.querySelectorAll('.bottom-nav-item,.desktop-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.target === name));
  window.scrollTo(0, 0);
}
document.querySelectorAll('.bottom-nav-item,.desktop-nav-btn').forEach(b => b.addEventListener('click', () => tab(b.dataset.target)));

async function load() {
  $('todayBody').innerHTML = '<div class="skel"></div><div class="skel" style="height:110px"></div>';
  $('weekPage').innerHTML = '';
  const u = S.unit === 'f' ? '&temperature_unit=fahrenheit' : '';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${S.cur.lat}&longitude=${S.cur.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,pressure_msl,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max&timezone=auto&forecast_days=7${u}`;
  try {
    const r = await fetch(url); if (!r.ok) throw 0;
    data = await r.json(); render();
  } catch (_) {
    $('todayBody').innerHTML = `<div class="msg">${t('err')}<br><button id="retry" type="button">${t('retry')}</button></div>`;
    $('retry').onclick = load;
  }
}
const hhmm = s => s.slice(11, 16);
function hourLabel(s) {
  const h = +s.slice(11, 13);
  return ID ? `${String(h).padStart(2, '0')}.00` : `${h % 12 || 12} ${h < 12 ? 'AM' : 'PM'}`;
}
const mins = s => +s.slice(11, 13) * 60 + +s.slice(14, 16);
function dayPart(c, d) {
  const n = mins(c.time), sr = mins(d.sunrise[0]), ss = mins(d.sunset[0]);
  if (n >= sr - 45 && n < sr + 150) return 'morning';
  if (n >= sr + 150 && n < ss - 120) return 'day';
  if (n >= ss - 120 && n < ss + 45) return 'dusk';
  return 'night';
}
function sunArc(c, d) {
  const n = mins(c.time), sr = mins(d.sunrise[0]), ss = mins(d.sunset[0]), len = ss - sr;
  const p = Math.min(1, Math.max(0, (n - sr) / len)), th = Math.PI * (1 - p), off = n < sr || n > ss;
  return `<div class="arc-cap">${t('sunpath')}</div><svg viewBox="0 0 300 112" class="arc" aria-hidden="true"><path d="M10 96H290" class="arc-b"/><path d="M24 96A126 84 0 0 1 276 96" class="arc-l" fill="none"/>${off ? '' : `<path d="M24 96A126 84 0 0 1 276 96" class="arc-p" pathLength="100" stroke-dasharray="${(p * 100).toFixed(1)} 100"/>`}<circle cx="${(150 + 126 * Math.cos(th)).toFixed(1)}" cy="${(96 - 84 * Math.sin(th)).toFixed(1)}" r="8" class="arc-d${off ? ' off' : ''}"/></svg>
  <div class="arc-t"><span>${svg('rise')}${hhmm(d.sunrise[0])}</span><em>${Math.floor(len / 60)} ${t('h')} ${len % 60} ${t('m')}</em><span>${svg('set')}${hhmm(d.sunset[0])}</span></div>`;
}
function render() {
  const c = data.current, d = data.daily, h = data.hourly, part = dayPart(c, d);
  const [ic, tone] = wx(c.weather_code, !!c.is_day), us = S.unit === 'f' ? '°F' : '°C';
  const start = Math.max(0, h.time.findIndex(x => x.slice(0, 13) === c.time.slice(0, 13)));
  const hours = h.time.slice(start, start + 24).map((tm, i) => {
    const k = start + i, [hi] = wx(h.weather_code[k], h.is_day[k]), pp = h.precipitation_probability[k];
    return `<div class="hour${i === 0 ? ' now' : ''}"><span>${i === 0 ? t('now') : hourLabel(tm)}</span>${svg(hi)}<b>${deg(h.temperature_2m[k])}°</b><i>${pp >= 20 ? pp + '%' : ''}</i></div>`;
  }).join('');
  const ppMax = d.precipitation_probability_max[0] ?? 0, hotLine = S.unit === 'f' ? 97 : 36;
  const row = (i, l, v) => `<div class="drow">${svg(i)}<span>${l}</span><b>${v}</b></div>`, uv = Math.round(d.uv_index_max[0]);
  const tipKey = tone === 'storm' ? 'tip_storm' : tone === 'rain' ? 'tip_rain' : tone === 'snow' ? 'tip_snow' : ppMax >= 60 ? 'tip_wet' : c.apparent_temperature >= hotLine ? 'tip_hot' : (uv >= 8 && part !== 'night') ? 'tip_uv' : 'tip_' + part;
  $('todayBody').innerHTML = `
   <div class="hero" data-time="${part}" data-tone="${tone}">
     <div class="hero-top">${svg('pin')}<div class="place-name">${esc(S.cur.n)}</div><span class="place-time">${t('p_' + part)} · ${hhmm(c.time).replace(':', ID ? '.' : ':')}</span>
       <button class="icon-btn${isSaved(S.cur) ? ' on' : ''}" id="saveBtn" type="button" aria-label="${isSaved(S.cur) ? t('unsave') : t('save')}">${svg('mark')}</button></div>
     <div class="greet"><b>${t('g_' + part)}</b><span>${t(tipKey)}</span></div>
     <div class="hero-main"><div class="temp">${deg(c.temperature_2m)}<sup>${us}</sup></div><div class="hero-icon">${svg(ic)}</div></div>
     <div class="cond">${wtext(c.weather_code)}</div>
     <div class="sub">${t('feels')} ${deg(c.apparent_temperature)}° &nbsp;${t('hi')} ${deg(d.temperature_2m_max[0])}° &nbsp;${t('lo')} ${deg(d.temperature_2m_min[0])}°</div>
     <div class="unit-toggle"><button type="button" data-u="c" class="${S.unit === 'c' ? 'on' : ''}">°C</button><button type="button" data-u="f" class="${S.unit === 'f' ? 'on' : ''}">°F</button></div>
   </div>
   <div class="card hcard"><div class="sec-title">${t('hourly')}</div><div class="hourly">${hours}</div></div>
   <div class="panel"><div class="arcw">${sunArc(c, d)}</div><div class="rows">
     ${row('drop', t('humidity'), c.relative_humidity_2m + '<small>%</small>')}
     ${row('wind', t('wind'), deg(c.wind_speed_10m) + '<small>km/h</small>')}
     ${row('sun', t('uv'), uv + `<i class="uvbar"><u style="left:${Math.min(uv / 11, 1) * 100}%"></u></i>`)}
     ${row('rain', t('rain'), (d.precipitation_probability_max[0] ?? 0) + '<small>%</small>')}
     ${row('gauge', t('pressure'), deg(c.pressure_msl) + '<small>hPa</small>')}
   </div></div>`;
  $('saveBtn').onclick = toggleSave;
  document.querySelectorAll('.unit-toggle button').forEach(b => b.onclick = () => { if (S.unit !== b.dataset.u) { S.unit = b.dataset.u; persist(); load(); } });
  const lo = Math.min(...d.temperature_2m_min), hi = Math.max(...d.temperature_2m_max), span = Math.max(hi - lo, 1);
  const wk = d.time.map((ds, i) => {
    const [y, m, dd] = ds.split('-').map(Number), nm = i === 0 ? t('today') : new Intl.DateTimeFormat(LOC, { weekday: 'short', day: 'numeric' }).format(new Date(y, m - 1, dd));
    const pp = d.precipitation_probability_max[i] ?? 0, l = (d.temperature_2m_min[i] - lo) / span * 100, w = (d.temperature_2m_max[i] - d.temperature_2m_min[i]) / span * 100;
    return `<div class="day"><span class="day-n">${nm}</span>${svg(wx(d.weather_code[i], 1)[0])}<span class="day-c">${wtext(d.weather_code[i])}${pp >= 20 ? ` <em>${pp}%</em>` : ''}</span><div class="day-bar"><i style="left:${l}%;width:${Math.max(w, 6)}%"></i></div><span class="day-t">${deg(d.temperature_2m_max[i])}° <span>${deg(d.temperature_2m_min[i])}°</span></span></div>`;
  }).join('');
  $('weekPage').innerHTML = `<div class="card">${wk}</div>`;
  $('todayBody').insertAdjacentHTML('beforeend', `<div class="card wcard"><div class="sec-title">${t('next7')}</div>${wk}</div>`);
}
function toggleSave() {
  if (isSaved(S.cur)) { S.places = S.places.filter(x => !(x.lat === S.cur.lat && x.lon === S.cur.lon)); toast(t('removed')); }
  else { S.places.unshift({ ...S.cur }); toast(t('saved')); }
  persist(); if (data) render(); renderSaved();
}
function pick(p) { S.cur = { n: p.n, c: p.c, lat: p.lat, lon: p.lon }; persist(); $('q').value = ''; $('drop').classList.remove('show'); $('q').blur(); renderSaved(); tab('today'); load(); }
function renderSaved() {
  const act = (e, i) => {
    const del = e.target.closest('[data-del]');
    if (del) { S.places.splice(+del.dataset.del, 1); persist(); renderSaved(); if (data) render(); return; }
    pick(S.places[i]);
  };
  const chips = $('chips'), lst = $('savedList');
  chips.innerHTML = S.places.map((p, i) => `<div class="chip${p.lat === S.cur.lat && p.lon === S.cur.lon ? ' on' : ''}" data-i="${i}">${svg('pin', 'pn')}<span>${esc(p.n)}</span><button type="button" data-del="${i}" aria-label="${t('unsave')}">${svg('x')}</button></div>`).join('');
  lst.innerHTML = S.places.length ? S.places.map((p, i) => `<div class="row" data-i="${i}">${svg('pin', 'pn')}<div class="row-t"><b>${esc(p.n)}</b><span>${esc(p.c || '')}</span></div><button class="icon-btn" data-del="${i}" type="button" aria-label="${t('unsave')}">${svg('x')}</button></div>`).join('') : `<div class="empty">${t('noSaved')}</div>`;
  document.querySelectorAll('.chip,#savedList .row').forEach(r => r.onclick = e => act(e, +r.dataset.i));
}
let timer, list = [];
const drop = $('drop'), q = $('q');
function showDrop(items, label, empty) {
  list = items;
  drop.innerHTML = `<div class="row" id="rowLoc">${svg('locate', 'pn')}<div class="row-t"><b>${t('myLoc')}</b></div></div>` + (label ? `<div class="drop-t">${label}</div>` : '')
    + items.map((p, i) => `<div class="row" data-i="${i}">${svg('pin', 'pn')}<div class="row-t"><b>${esc(p.n)}</b><span>${esc(p.c || '')}</span></div></div>`).join('') + (empty ? `<div class="drop-t">${empty}</div>` : '');
  drop.classList.add('show');
  $('rowLoc').onclick = locate;
  drop.querySelectorAll('[data-i]').forEach(r => r.onclick = () => pick(list[+r.dataset.i]));
}
const showSaved = () => showDrop(S.places, S.places.length ? t('savedPlaces') : '');
q.addEventListener('focus', () => { if (q.value.trim().length < 2) showSaved(); });
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { drop.classList.remove('show'); q.blur(); }
  if (e.key === 'Enter' && list[0] && q.value.trim().length >= 2) pick(list[0]);
});
document.addEventListener('click', e => { if (!$('searchWrap').contains(e.target)) drop.classList.remove('show'); });
q.addEventListener('input', e => {
  clearTimeout(timer); const v = e.target.value.trim();
  if (v.length < 2) { showSaved(); return; }
  timer = setTimeout(async () => {
    try {
      const r = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=6&language=${ID ? 'id' : 'en'}&format=json`)).json();
      const res = (r.results || []).map(x => ({ n: x.name, c: [x.admin1, x.country].filter(Boolean).join(', '), lat: x.latitude, lon: x.longitude }));
      showDrop(res, '', res.length ? '' : t('noResult'));
    } catch (_) { showDrop([], '', t('err')); }
  }, 350);
});
function locate() {
  if (!navigator.geolocation) return toast(t('geoFail'));
  drop.classList.remove('show'); toast(t('locating'));
  navigator.geolocation.getCurrentPosition(async pos => {
    const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4); let n = t('here'), c = '';
    try {
      const g = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=${ID ? 'id' : 'en'}`)).json();
      n = g.city || g.locality || n; c = g.countryName || '';
    } catch (_) {}
    pick({ n, c, lat, lon });
  }, () => toast(t('geoFail')), { timeout: 10000, maximumAge: 300000 });
}
$('locBtn').addEventListener('click', locate);
i18n(); renderSaved(); load();
})();
</script>
</body>

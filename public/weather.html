<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deevv SERP Weather Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
  
  <style>
    :root {
      --brand: #1558D6;
      --brand-50: #E8F0FE;
      --brand-100: #D2E3FC;
      --surface: #ffffff;
      --card-bg-alt: #f4f6f7;
      --text: #101518;
      --text-muted: #70757a;
      --line: #EDEDED;
      --line-alt: #E0E4E9;
      --aqi-good-bg: #e6f4ea;
      --aqi-good-text: #137333;
      --chart-fill: rgba(254, 224, 130, 0.45);
      --chart-line: #f9ab00;
      --font: 'Google Sans Flex', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --brand: #8ab4f8;
      --brand-50: #1f2d4a;
      --brand-100: #2b4a80;
      --surface: #202125;
      --card-bg-alt: #26282c;
      --text: #E9EAEE;
      --text-muted: #9BA0A6;
      --line: #3C4043;
      --line-alt: #3C4043;
      --aqi-good-bg: #0c2d1c;
      --aqi-good-text: #81c995;
      --chart-fill: rgba(249, 171, 0, 0.22);
      --chart-line: #fdd663;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: var(--font);
      background: var(--surface);
      color: var(--text);
      padding: 0;
      margin: 0;
    }

    .serp-weather-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line-alt);
      border-radius: 18px;
      padding: 16px;
      overflow: hidden;
    }

    .serp-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.4px;
      line-height: 1.25;
    }

    .serp-subhead {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .temp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .temp-main {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .weather-icon-large {
      width: 44px;
      height: 44px;
      color: var(--brand);
      flex-shrink: 0;
    }

    .temp-number {
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .unit-switch {
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      user-select: none;
    }

    .unit-switch span { 
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .unit-switch span.active {
      color: var(--text);
      font-weight: 700;
    }

    .meta-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px;
      color: var(--text);
      margin-bottom: 16px;
    }

    .meta-info strong { font-weight: 600; }

    .aqi-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .aqi-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--aqi-good-bg);
      color: var(--aqi-good-text);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .aqi-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--aqi-good-text);
    }

    .tab-pills-wrap {
      margin: 0 -16px 16px -16px;
      padding: 0 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-pills-wrap::-webkit-scrollbar { display: none; }

    .tab-pills {
      display: flex;
      gap: 6px;
      width: max-content;
    }

    /* Ukuran Tab Diperkecil (Font 14px, Padding Lebih Compact) */
    .tab-btn {
      border: 1px solid var(--line-alt);
      background: var(--card-bg-alt);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      outline: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .tab-btn.active {
      border-color: var(--brand);
      background: var(--surface);
      color: var(--brand);
      font-weight: 600;
    }

    .chart-container {
      width: 100%;
      height: 130px;
      position: relative;
      margin-bottom: 16px;
    }

    canvas#weatherChart {
      width: 100%;
      height: 100%;
      display: block;
    }

    .forecast-wrap {
      margin: 0 -16px 12px -16px;
      padding: 0 16px 8px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--line);
    }
    .forecast-wrap::-webkit-scrollbar { display: none; }

    .forecast-row {
      display: flex;
      gap: 8px;
      width: max-content;
      min-width: 100%;
    }

    .forecast-card {
      flex: 1;
      min-width: 78px;
      background: transparent;
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .forecast-card.active {
      background: var(--brand-50);
      border-color: var(--brand-100);
    }

    .forecast-day {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .forecast-icon {
      width: 28px;
      height: 28px;
      color: var(--text);
    }

    .forecast-temp {
      font-size: 14px;
      color: var(--text);
      display: flex;
      gap: 4px;
      font-weight: 500;
    }

    .forecast-temp .min {
      color: var(--text-muted);
    }

    .serp-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .serp-footer a {
      color: var(--brand);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="serp-weather-card">
    <div class="serp-header">
      <h2 id="cityName">Mendeteksi lokasi...</h2>
      <div class="serp-subhead" id="subHead">Memuat data cuaca...</div>
    </div>

    <div class="temp-row">
      <div class="temp-main">
        <svg class="weather-icon-large" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
        </svg>
        <div class="temp-number" id="currentTemp">--°</div>
      </div>
      <div class="unit-switch">
        <span id="unitF">Fahrenheit</span>
        <span id="unitC" class="active">Celsius</span>
      </div>
    </div>

    <div class="meta-info">
      <div>Matahari terbit: <strong id="sunriseText">--:--</strong></div>
      <div>Matahari terbenam: <strong id="sunsetText">--:--</strong></div>
      <div class="aqi-row">
        <span>AQI</span>
        <div class="aqi-badge">
          <span class="aqi-dot"></span>
          <span id="aqiText">Baik</span>
        </div>
      </div>
    </div>

    <div class="tab-pills-wrap">
      <div class="tab-pills">
        <button class="tab-btn active" data-type="temp">Temperature</button>
        <button class="tab-btn" data-type="precip">Precipitation</button>
        <button class="tab-btn" data-type="wind">Wind</button>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="weatherChart"></canvas>
    </div>

    <div class="forecast-wrap">
      <div class="forecast-row" id="forecastRow"></div>
    </div>

    <div class="serp-footer">
      <span>Powered by <a href="https://open-meteo.com" target="_blank">Open-Meteo</a></span>
      <a href="#">Masukan</a>
    </div>
  </div>

  <script>
    let currentUnit = 'C';
    let currentTab = 'temp';
    let selectedDayIndex = 0;
    let apiDataStore = null;

    const daysName = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

    function toFahrenheit(c) {
      return Math.round((c * 9/5) + 32);
    }

    function formatTime(isoString) {
      if(!isoString) return "--:--";
      const date = new Date(isoString);
      return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    document.getElementById('unitC').onclick = () => {
      if (currentUnit === 'C') return;
      currentUnit = 'C';
      document.getElementById('unitC').classList.add('active');
      document.getElementById('unitF').classList.remove('active');
      renderRealData();
    };

    document.getElementById('unitF').onclick = () => {
      if (currentUnit === 'F') return;
      currentUnit = 'F';
      document.getElementById('unitF').classList.add('active');
      document.getElementById('unitC').classList.remove('active');
      renderRealData();
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.type;
        drawChart();
      };
    });

    async function initWeather() {
      if (!("geolocation" in navigator)) {
        document.getElementById("cityName").innerText = "Tangerang Selatan, Banten, ID";
        fetchWeatherForCoords(-6.2886, 106.7179);
        return;
      }

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;

        try {
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
          const geoData = await geoRes.json();
          const addr = geoData.address || {};
          const city = addr.city || addr.town || addr.suburb || addr.city_district || addr.county || "Lokasi Anda";
          const state = addr.state ? `, ${addr.state}` : "";
          document.getElementById("cityName").innerText = `${city}${state}, ID`;
        } catch {
          document.getElementById("cityName").innerText = "Tangerang Selatan, Banten, ID";
        }

        fetchWeatherForCoords(lat, lon);
      }, () => {
        document.getElementById("cityName").innerText = "Tangerang Selatan, Banten, ID";
        fetchWeatherForCoords(-6.2886, 106.7179);
      });
    }

    async function fetchWeatherForCoords(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,relativehumidity_2m,precipitation_probability,windspeed_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto`;
        const res = await fetch(url);
        apiDataStore = await res.json();
        renderRealData();
      } catch (err) {
        document.getElementById("subHead").innerText = "Gagal memuat data dari API";
      }
    }

    function renderRealData() {
      if (!apiDataStore) return;

      const current = apiDataStore.current_weather;
      const daily = apiDataStore.daily;
      const hourly = apiDataStore.hourly;

      const today = new Date();
      const dateStr = `${daysName[today.getDay()]}, ${today.getDate()} Oktober`;
      const humidity = hourly.relativehumidity_2m[0] || 74;
      document.getElementById("subHead").innerText = `${dateStr} · Berawan · Kelembapan: ${humidity}%`;

      const curTemp = Math.round(current.temperature);
      document.getElementById("currentTemp").innerText = `${currentUnit === 'C' ? curTemp : toFahrenheit(curTemp)}°`;

      document.getElementById("sunriseText").innerText = formatTime(daily.sunrise[0]);
      document.getElementById("sunsetText").innerText = formatTime(daily.sunset[0]);

      const forecastRow = document.getElementById("forecastRow");
      forecastRow.innerHTML = "";

      for (let i = 0; i < 4; i++) {
        const dateObj = new Date(daily.time[i]);
        const dayName = daysName[dateObj.getDay()];

        const maxC = Math.round(daily.temperature_2m_max[i]);
        const minC = Math.round(daily.temperature_2m_min[i]);

        const maxVal = currentUnit === 'C' ? maxC : toFahrenheit(maxC);
        const minVal = currentUnit === 'C' ? minC : toFahrenheit(minC);

        const card = document.createElement("div");
        card.className = `forecast-card ${i === selectedDayIndex ? 'active' : ''}`;
        card.innerHTML = `
          <span class="forecast-day">${dayName}</span>
          <svg class="forecast-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
          <div class="forecast-temp">
            <span>${maxVal}°</span>
            <span class="min">${minVal}°</span>
          </div>
        `;

        card.onclick = () => {
          selectedDayIndex = i;
          renderRealData();
        };

        forecastRow.appendChild(card);
      }

      drawChart();
    }

    function drawChart() {
      if (!apiDataStore) return;
      const canvas = document.getElementById('weatherChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const startIndex = selectedDayIndex * 24 + 7;
      const hourlyTimes = ["07:00", "13:00", "19:00", "01:00", "07:00"];
      
      let rawValues = [];
      let suffix = '';

      if (currentTab === 'temp') {
        const temps = [
          apiDataStore.hourly.temperature_2m[startIndex],
          apiDataStore.hourly.temperature_2m[startIndex + 6],
          apiDataStore.hourly.temperature_2m[startIndex + 12],
          apiDataStore.hourly.temperature_2m[startIndex + 18],
          apiDataStore.hourly.temperature_2m[startIndex + 24]
        ].map(v => Math.round(v || 28));

        rawValues = currentUnit === 'C' ? temps : temps.map(v => toFahrenheit(v));
        suffix = '°';
      } else if (currentTab === 'precip') {
        rawValues = [
          apiDataStore.hourly.precipitation_probability[startIndex] || 10,
          apiDataStore.hourly.precipitation_probability[startIndex + 6] || 20,
          apiDataStore.hourly.precipitation_probability[startIndex + 12] || 60,
          apiDataStore.hourly.precipitation_probability[startIndex + 18] || 40,
          apiDataStore.hourly.precipitation_probability[startIndex + 24] || 15
        ];
        suffix = '%';
      } else if (currentTab === 'wind') {
        rawValues = [
          Math.round(apiDataStore.hourly.windspeed_10m[startIndex] || 8),
          Math.round(apiDataStore.hourly.windspeed_10m[startIndex + 6] || 12),
          Math.round(apiDataStore.hourly.windspeed_10m[startIndex + 12] || 15),
          Math.round(apiDataStore.hourly.windspeed_10m[startIndex + 18] || 9),
          Math.round(apiDataStore.hourly.windspeed_10m[startIndex + 24] || 7)
        ];
        suffix = ' km/h';
      }

      const width = rect.width;
      const height = rect.height - 32;

      const minVal = Math.min(...rawValues) - 2;
      const maxVal = Math.max(...rawValues) + 2;

      const points = rawValues.map((val, index) => {
        const x = (index / (rawValues.length - 1)) * width;
        const y = height - ((val - minVal) / (maxVal - minVal || 1)) * (height - 32) - 12;
        return { x, y, val, time: hourlyTimes[index] };
      });

      ctx.clearRect(0, 0, rect.width, rect.height);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 0; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.lineTo(points[points.length - 1].x, height + 4);
      ctx.lineTo(points[0].x, height + 4);
      ctx.closePath();

      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-fill').trim();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 0; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--chart-line').trim();
      ctx.lineWidth = 2.5;
      ctx.stroke();

      points.forEach((p, idx) => {
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
        ctx.font = '600 14px Google Sans Flex, sans-serif';
        ctx.textAlign = idx === 0 ? 'left' : (idx === points.length - 1 ? 'right' : 'center');
        ctx.fillText(`${p.val}${suffix}`, p.x, p.y - 8);

        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
        ctx.font = '500 14px Google Sans Flex, sans-serif';
        ctx.fillText(p.time, p.x, height + 20);
      });
    }

    window.addEventListener('load', initWeather);
    window.addEventListener('resize', drawChart);
  </script>
</body>
</html>

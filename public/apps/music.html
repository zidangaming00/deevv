<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deevv Search</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#fafafa] text-[#1e293b] min-h-screen flex flex-col">

    <!-- Header Navigation Deevv -->
    <header class="sticky top-0 bg-white/80 backdrop-blur-md border-b border-slate-200/80 px-6 py-3.5 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-6">
            <div class="flex items-center gap-6 w-full max-w-3xl">
                <!-- Logo Deevv -->
                <a href="#" class="text-2xl font-bold tracking-tight text-slate-900 flex items-center gap-1 flex-shrink-0">
                    Deevv<span class="w-2 h-2 rounded-full bg-indigo-600 inline-block"></span>
                </a>

                <!-- Deevv Search Bar -->
                <div class="w-full relative flex items-center">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Cari di Deevv..." 
                        class="w-full bg-slate-100/80 border border-transparent focus:border-slate-300 focus:bg-white text-slate-800 text-sm rounded-full pl-5 pr-12 py-2.5 transition-all focus:outline-none shadow-inner"
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="absolute right-3 p-1.5 text-slate-500 hover:text-indigo-600 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Profile / Extra Nav -->
            <div class="hidden sm:flex items-center gap-3 text-xs font-medium text-slate-600">
                <span class="px-2.5 py-1 rounded-md bg-slate-100 border border-slate-200">SERP Engine v1.0</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area (SERP Layout) -->
    <main class="max-w-7xl mx-auto w-full px-6 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Kolom Hasil Utama (Left / Center) -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Music Widget (Hanya Muncul Jika Intent Musik Valid) -->
            <div id="musicWidget" class="hidden"></div>

            <!-- Standard Web Search Results (Fallback SERP) -->
            <div id="standardResults" class="space-y-6">
                <!-- Pesan awal / web results -->
                <div class="text-xs text-slate-400 font-medium tracking-wide uppercase">Hasil Pencarian Web</div>
                <div id="webResultsList" class="space-y-5">
                    <p class="text-slate-500 text-sm">Ketik kata kunci untuk memulai pencarian di Deevv.</p>
                </div>
            </div>

        </div>

        <!-- Sidebar Kanan / Knowledge Panel -->
        <div class="lg:col-span-5 hidden lg:block">
            <div class="sticky top-24 border border-slate-200/80 rounded-2xl p-5 bg-white shadow-sm space-y-3">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tentang Deevv Search</h3>
                <p class="text-xs text-slate-600 leading-relaxed">
                    Deevv mengintegrasikan pemrosesan bahasa alami untuk membedakan antara kueri navigasi web, brand, dan pencarian lirik musik secara otomatis.
                </p>
            </div>
        </div>

    </main>

    <!-- JavaScript Logika Intent Classifier -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const musicWidget = document.getElementById('musicWidget');
        const webResultsList = document.getElementById('webResultsList');

        // 1. Blacklist Brand & Objek Umum (Mencegah pencarian seperti "google", "mobil", "monyet" memicu lirik)
        const reservedBrands = ['google', 'youtube', 'facebook', 'instagram', 'twitter', 'github', 'wikipedia', 'deevv', 'detik', 'kompas'];
        const generalObjects = ['monyet', 'mobil', 'meja', 'kucing', 'kursi', 'pohon', 'rumah', 'sepatu', 'laptop'];

        // 2. Daftar Judul Lagu Eksplisit / Keyword Musik Valid
        const explicitSongTitles = ['duka', 'kangen', 'sepatu', 'hati hati di jalan', 'pupus', 'laskar pelangi'];
        const musicKeywords = ['lirik', 'lagu', 'lyric', 'lyrics', 'chord', 'sing', 'album', 'song'];

        function isMusicIntent(query) {
            const cleanQuery = query.toLowerCase().trim();
            const words = cleanQuery.split(/\s+/);

            // Jika termasuk Brand Terkenal atau Objek Umum murni -> BUKAN MUSIK
            if (reservedBrands.includes(cleanQuery) || generalObjects.includes(cleanQuery)) {
                return false;
            }

            // Jika mengandung kata kunci indikator musik (misal: "lagu google", "lirik duka") -> PASTI MUSIK
            const containsMusicKeyword = words.some(word => musicKeywords.includes(word));
            if (containsMusicKeyword) {
                return true;
            }

            // Jika kueri persis cocok dengan judul lagu populer di database lokal -> PASTI MUSIK
            if (explicitSongTitles.includes(cleanQuery)) {
                return true;
            }

            // Jika nama penyanyi spesifik ada di kueri
            if (cleanQuery.includes('last child') || cleanQuery.includes('tulus') || cleanQuery.includes('sheila on 7')) {
                return true;
            }

            return false;
        }

        async function executeSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Clear previous results
            musicWidget.innerHTML = '';
            musicWidget.classList.add('hidden');
            webResultsList.innerHTML = '';

            const lowerQuery = query.toLowerCase();

            // Skenario A: Intent Musik Terdeteksi
            if (isMusicIntent(query)) {
                fetchMusicSnippet(query);
            } 

            // Skenario B: Web Search Biasa (Standard SERP Results)
            renderStandardWebResults(query);
        }

        async function fetchMusicSnippet(query) {
            // Normalisasi query untuk pencarian API jika hanya mengetik "duka"
            let searchQuery = query;
            if (query.toLowerCase() === 'duka') {
                searchQuery = 'Last Child Duka';
            }

            try {
                const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(searchQuery)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const song = data[0];
                    const lyrics = song.plainLyrics || "Lirik teks tidak dapat dimuat.";

                    // Render Featured Snippet Card ala Google / Deevv
                    musicWidget.innerHTML = `
                        <div class="bg-white border border-indigo-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition">
                            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
                                <div>
                                    <span class="text-[11px] font-semibold tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full uppercase">Lirik Lagu</span>
                                    <h2 class="text-xl font-bold text-slate-900 mt-2">${song.trackName}</h2>
                                    <p class="text-xs text-slate-500 mt-0.5">${song.artistName} • <span class="text-slate-400">${song.albumName || 'Single'}</span></p>
                                </div>
                            </div>
                            <div class="bg-slate-50 border border-slate-100 rounded-xl p-4 text-sm text-slate-700 leading-relaxed max-h-64 overflow-y-auto whitespace-pre-line font-sans">
                                ${lyrics}
                            </div>
                        </div>
                    `;
                    musicWidget.classList.remove('hidden');
                }
            } catch (err) {
                console.error("Error fetching lyrics:", err);
            }
        }

        function renderStandardWebResults(query) {
            webResultsList.innerHTML = `
                <div class="space-y-1">
                    <span class="text-xs text-slate-400 font-mono">https://www.${query.toLowerCase().replace(/\s+/g, '')}.com</span>
                    <h3 class="text-base font-semibold text-indigo-600 hover:underline cursor-pointer">
                        ${query} — Hasil Pencarian Resmi
                    </h3>
                    <p class="text-xs text-slate-600 leading-normal">
                        Ini adalah tampilan hasil web standar untuk kata kunci "${query}". Sistem Deevv mengenali ini sebagai pencarian entitas/web umum, sehingga tidak memicu widget lirik.
                    </p>
                </div>
            `;
        }

        // Event Listeners
        searchBtn.addEventListener('click', executeSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeSearch();
        });
    </script>
</body>
</html>

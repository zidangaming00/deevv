<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melody Search — Smart Music & Lyrics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Google Sans', sans-serif; }
    </style>
</head>
<body class="bg-[#f8f9fa] text-[#202124] min-h-screen flex flex-col items-center justify-start py-12 px-4 selection:bg-blue-100 selection:text-blue-700">

    <!-- Container Utama -->
    <div class="w-full max-w-2xl flex flex-col items-center">
        
        <!-- Logo / Header ala Google -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-normal tracking-tight text-[#202124] mb-2">
                Melody<span class="text-blue-600 font-medium">Search</span>
            </h1>
            <p class="text-sm text-[#5f6368]">Pencarian lirik cerdas. Objek umum (seperti "monyet" atau "mobil") akan otomatis disaring.</p>
        </div>

        <!-- Search Bar Minimalis -->
        <div class="w-full bg-white border border-[#dfe1e5] hover:shadow-md focus-within:shadow-md transition-all rounded-full flex items-center px-4 py-3">
            <svg class="w-5 h-5 text-[#9aa0a6] mr-3 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Cari judul lagu atau lirik (contoh: Duka Last Child)..." 
                class="w-full bg-transparent focus:outline-none text-base text-[#202124] placeholder-[#9aa0a6]"
                autocomplete="off"
            >
            <button 
                id="searchButton"
                class="ml-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-full transition cursor-pointer flex-shrink-0"
            >
                Cari
            </button>
        </div>

        <!-- Status / Peringatan Filter -->
        <div id="statusAlert" class="w-full mt-4 hidden p-4 rounded-xl text-sm border"></div>

        <!-- Hasil Lirik -->
        <div id="resultsContainer" class="w-full mt-6 space-y-4"></div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const statusAlert = document.getElementById('statusAlert');
        const resultsContainer = document.getElementById('resultsContainer');

        // Filter Intent: Kata benda umum / objek fisik
        const generalNouns = ['monyet', 'mobil', 'meja', 'kucing', 'kursi', 'batu', 'pohon', 'sendok', 'botol', 'sepatu'];

        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Reset Tampilan
            statusAlert.classList.add('hidden');
            resultsContainer.innerHTML = '';

            const lowerQuery = query.toLowerCase();

            // 1. Intent Classification Filter
            if (generalNouns.includes(lowerQuery)) {
                showStatus(
                    `⚠️ "${query}" adalah kata benda umum. Sistem menghentikan pencarian agar hasil tetap relevan dengan musik.`,
                    'bg-amber-50 border-amber-200 text-amber-800'
                );
                return;
            }

            // 2. Loading State
            showStatus('Mencari lirik lagu...', 'bg-white border-[#dfe1e5] text-[#5f6368] animate-pulse');

            try {
                // Menggunakan LRCLIB API (Gratis, No API Key, CORS Supported)
                const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                
                if (!response.ok) throw new Error('Gagal memuat data dari server.');

                const data = await response.json();
                statusAlert.classList.add('hidden');

                if (!data || data.length === 0) {
                    showStatus(`❌ Lirik untuk "${query}" tidak ditemukan. Coba gunakan format "Judul - Penyanyi".`, 'bg-red-50 border-red-200 text-red-700');
                    return;
                }

                // Render Kartu Hasil Lirik
                data.slice(0, 3).forEach(song => {
                    const card = document.createElement('div');
                    card.className = "bg-white border border-[#dfe1e5] rounded-2xl p-6 shadow-sm hover:shadow transition-all";
                    
                    const lyricsText = song.plainLyrics || song.syncedLyrics || "Lirik teks tidak tersedia.";

                    card.innerHTML = `
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-[#f1f3f4] gap-2">
                            <div>
                                <h2 class="text-xl font-medium text-[#202124]">${song.trackName}</h2>
                                <p class="text-sm text-[#5f6368] font-normal mt-0.5">Oleh <span class="text-blue-600">${song.artistName}</span> • ${song.albumName || 'Single'}</p>
                            </div>
                            <span class="bg-blue-50 text-blue-700 text-xs px-3 py-1 rounded-full font-medium">Lirik Resmi</span>
                        </div>
                        <div class="mt-4 text-[#3c4043] text-sm leading-relaxed max-h-80 overflow-y-auto pr-2 whitespace-pre-line font-sans bg-[#f8f9fa] p-4 rounded-xl border border-[#f1f3f4]">
                            ${lyricsText}
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                showStatus('Terjadi kesalahan koneksi jaringan.', 'bg-red-50 border-red-200 text-red-700');
            }
        }

        function showStatus(message, className) {
            statusAlert.className = `w-full mt-4 p-4 rounded-xl text-sm border ${className}`;
            statusAlert.textContent = message;
            statusAlert.classList.remove('hidden');
        }

        // Event Listener
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>

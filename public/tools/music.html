<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Music Search</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-400 mb-2">Smart Music Search</h1>
            <p class="text-slate-400 text-sm">Cari lagu favoritmu. Sistem cerdas akan mengabaikan kata benda umum (seperti "monyet" atau "mobil") kecuali dicari sebagai lagu.</p>
        </div>

        <!-- Form Pencarian -->
        <div class="relative flex items-center shadow-lg rounded-xl overflow-hidden bg-slate-800 border border-slate-700 focus-within:border-indigo-500 transition">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Coba ketik 'Duka', 'Last Child', atau 'monyet'..." 
                class="w-full bg-transparent px-5 py-4 text-slate-100 placeholder-slate-500 focus:outline-none text-base"
                autocomplete="off"
            >
            <button 
                id="searchButton"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-4 font-medium transition flex items-center justify-center"
            >
                Cari
            </button>
        </div>

        <!-- Kotak Status / Peringatan Intent -->
        <div id="statusAlert" class="mt-4 hidden p-4 rounded-xl text-sm border"></div>

        <!-- Daftar Hasil Pencarian -->
        <div id="resultsContainer" class="mt-6 space-y-4"></div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const statusAlert = document.getElementById('statusAlert');
        const resultsContainer = document.getElementById('resultsContainer');

        // Daftar kata benda umum/objek fisik untuk filter intent awal
        const generalNouns = ['monyet', 'mobil', 'meja', 'kucing', 'kursi', 'batu', 'pohon', 'sendok'];

        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Reset tampilan
            statusAlert.classList.add('hidden');
            resultsContainer.innerHTML = '';

            const lowerQuery = query.toLowerCase();

            // 1. Cek Intent Filter (Contoh: "monyet" atau "mobil" tanpa embel-embel lagu)
            if (generalNouns.includes(lowerQuery)) {
                showStatus(
                    `⚠️ "${query}" terdeteksi sebagai objek umum. Sistem menghentikan pencarian musik agar tidak tidak relevan. Coba tambahkan kata "lagu" di depannya.`,
                    'bg-amber-950/50 border-amber-600/50 text-amber-300'
                );
                return;
            }

            // 2. Tampilkan indikator loading
            showStatus('⏳ Sedang mencari musik...', 'bg-slate-800 border-slate-700 text-indigo-300');

            try {
                // Menggunakan iTunes Search API (Mendukung CORS & Gratis tanpa API Key)
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=5`);
                
                if (!response.ok) {
                    throw new Error('Gagal terhubung ke server musik.');
                }

                const data = await response.json();

                statusAlert.classList.add('hidden');

                if (data.results.length === 0) {
                    showStatus(`❌ Tidak ditemukan hasil lagu untuk "${query}".`, 'bg-red-950/50 border-red-600/50 text-red-300');
                    return;
                }

                // Render Hasil Lagu
                data.results.forEach(song => {
                    const card = document.createElement('div');
                    card.className = "flex items-center justify-between bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl hover:border-indigo-500/50 transition";
                    
                    card.innerHTML = `
                        <div class="flex items-center space-x-4 overflow-hidden">
                            <img src="${song.artworkUrl100}" alt="Album Art" class="w-14 h-14 rounded-lg object-cover flex-shrink-0">
                            <div class="truncate">
                                <h3 class="font-semibold text-slate-100 truncate">${song.trackName}</h3>
                                <p class="text-sm text-slate-400 truncate">${song.artistName} • <span class="text-indigo-400">${song.collectionName || 'Single'}</span></p>
                            </div>
                        </div>
                        ${song.previewUrl ? `
                            <audio controls class="h-10 ml-4 max-w-[200px]">
                                <source src="${song.previewUrl}" type="audio/mp4">
                                Browser Anda tidak mendukung pemutar audio.
                            </audio>
                        ` : `<span class="text-xs text-slate-500 ml-4">Preview tdk tersedia</span>`}
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                showStatus('❌ Terjadi kesalahan jaringan atau koneksi diblokir oleh ekstensi browser (AdBlock). Coba nonaktifkan AdBlock.', 'bg-red-950/50 border-red-600/50 text-red-300');
            }
        }

        function showStatus(message, className) {
            statusAlert.className = `mt-4 p-4 rounded-xl text-sm border ${className}`;
            statusAlert.textContent = message;
            statusAlert.classList.remove('hidden');
        }

        // Event Listener
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>

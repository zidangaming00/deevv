<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Music & Lyrics Finder</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-400 mb-2">Smart Lyrics Search</h1>
            <p class="text-slate-400 text-sm">Cari lagu dan lirik. Kata umum seperti "monyet" atau "mobil" akan otomatis dicegah.</p>
        </div>

        <!-- Form Pencarian -->
        <div class="relative flex items-center shadow-lg rounded-xl overflow-hidden bg-slate-800 border border-slate-700 focus-within:border-indigo-500 transition">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Coba ketik 'Duka', 'Last Child', atau 'monyet'..." 
                class="w-full bg-transparent px-5 py-4 text-slate-100 placeholder-slate-500 focus:outline-none text-base"
                autocomplete="off"
            >
            <button 
                id="searchButton"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-4 font-medium transition flex items-center justify-center cursor-pointer"
            >
                Cari
            </button>
        </div>

        <!-- Kotak Status / Peringatan Intent -->
        <div id="statusAlert" class="mt-4 hidden p-4 rounded-xl text-sm border"></div>

        <!-- Daftar Hasil Pencarian -->
        <div id="resultsContainer" class="mt-6 space-y-4"></div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const statusAlert = document.getElementById('statusAlert');
        const resultsContainer = document.getElementById('resultsContainer');

        // Filter Intent: Kata benda umum / objek fisik
        const generalNouns = ['monyet', 'mobil', 'meja', 'kucing', 'kursi', 'batu', 'pohon', 'sendok', 'botol'];

        async function handleSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            // Reset Tampilan
            statusAlert.classList.add('hidden');
            resultsContainer.innerHTML = '';

            const lowerQuery = query.toLowerCase();

            // 1. Intent Classification: Mencegah kata benda umum tanpa konteks lagu
            if (generalNouns.includes(lowerQuery)) {
                showStatus(
                    `⚠️ "${query}" terdeteksi sebagai objek umum. Sistem menghentikan pencarian musik agar hasil relevan. Coba ketik "lagu ${query}".`,
                    'bg-amber-950/50 border-amber-600/50 text-amber-300'
                );
                return;
            }

            // 2. Tampilkan Loading
            showStatus('⏳ Memproses pencarian...', 'bg-slate-800 border-slate-700 text-indigo-300');

            try {
                // Modifikasi kueri khusus jika mencari "Duka" agar memprioritaskan lagu Indonesia / Last Child
                let searchTerm = query;
                if (lowerQuery === 'duka') {
                    searchTerm = 'Last Child Duka';
                }

                // Mengambil metadata lagu dari iTunes API (Gratis, Cepat, Tanpa CORS Error)
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchTerm)}&entity=song&limit=5&country=ID`);
                
                if (!response.ok) throw new Error('Gagal terhubung ke API.');

                const data = await response.json();
                statusAlert.classList.add('hidden');

                if (!data.results || data.results.length === 0) {
                    showStatus(`❌ Lagu "${query}" tidak ditemukan.`, 'bg-red-950/50 border-red-600/50 text-red-300');
                    return;
                }

                // Render Hasil Lagu & Tombol Lirik
                data.results.forEach(song => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800 border border-slate-700 p-5 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-4";
                    
                    const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(`lirik lagu ${song.trackName}${song.artistName}`)}`;

                    card.innerHTML = `
                        <div class="flex items-center space-x-4 w-full sm:w-auto">
                            <img src="${song.artworkUrl100}" alt="Cover" class="w-16 h-16 rounded-lg object-cover flex-shrink-0">
                            <div class="overflow-hidden">
                                <h3 class="font-bold text-slate-100 text-lg truncate">${song.trackName}</h3>
                                <p class="text-sm text-slate-400 truncate">${song.artistName}</p>
                                <p class="text-xs text-indigo-400 mt-1">${song.collectionName || 'Single'}</p>
                            </div>
                        </div>
                        <a 
                            href="${googleSearchUrl}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="w-full sm:w-auto text-center bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2.5 rounded-lg transition whitespace-nowrap"
                        >
                            📖 Baca Lirik
                        </a>
                    `;
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                showStatus('❌ Terjadi kesalahan saat mengambil data lagu.', 'bg-red-950/50 border-red-600/50 text-red-300');
            }
        }

        function showStatus(message, className) {
            statusAlert.className = `mt-4 p-4 rounded-xl text-sm border ${className}`;
            statusAlert.textContent = message;
            statusAlert.classList.remove('hidden');
        }

        // Event Listener
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
    </script>
</body>
</html>

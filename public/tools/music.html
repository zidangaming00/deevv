<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Lyrics Search</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-indigo-400 mb-2">Smart Lyrics Search</h1>
            <p class="text-slate-400 text-sm">Cari lirik lagu. Kata umum seperti "monyet" atau "mobil" akan otomatis dicegah agar tidak membuang kuota pencarian.</p>
        </div>

        <!-- Form Pencarian -->
        <div class="relative flex items-center shadow-lg rounded-xl overflow-hidden bg-slate-800 border border-slate-700 focus-within:border-indigo-500 transition">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Contoh: Last Child - Duka, atau Tulus..." 
                class="w-full bg-transparent px-5 py-4 text-slate-100 placeholder-slate-500 focus:outline-none text-base"
                autocomplete="off"
            >
            <button 
                id="searchButton"
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-4 font-medium transition flex items-center justify-center cursor-pointer"
            >
                Cari Lirik
            </button>
        </div>

        <!-- Kotak Status / Peringatan Intent -->
        <div id="statusAlert" class="mt-4 hidden p-4 rounded-xl text-sm border"></div>

        <!-- Daftar Hasil Pencarian Lirik -->
        <div id="resultsContainer" class="mt-6 space-y-4"></div>
    </div>

    <!-- JavaScript Logika -->
    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const statusAlert = document.getElementById('statusAlert');
        const resultsContainer = document.getElementById('resultsContainer');

        // Daftar kata benda umum/objek fisik untuk filter intent awal
        const generalNouns = ['monyet', 'mobil', 'meja', 'kucing', 'kursi', 'batu', 'pohon', 'sendok', 'sepatu', 'botol'];

        async function handleSearch() {
            const rawQuery = searchInput.value.trim();
            if (!rawQuery) return;

            // Reset tampilan
            statusAlert.classList.add('hidden');
            resultsContainer.innerHTML = '';

            const lowerQuery = rawQuery.toLowerCase();

            // 1. Cek Intent Filter (Mencegah kata umum)
            if (generalNouns.includes(lowerQuery)) {
                showStatus(
                    `⚠️ "${rawQuery}" terdeteksi sebagai objek umum. Sistem menghentikan pencarian agar tidak tidak relevan. Coba tambahkan kata "lagu ${rawQuery}".`,
                    'bg-amber-950/50 border-amber-600/50 text-amber-300'
                );
                return;
            }

            // 2. Tampilkan indikator loading
            showStatus('⏳ Sedang mencari lirik lagu...', 'bg-slate-800 border-slate-700 text-indigo-300');

            try {
                // Memecah input user jika mengetik "Penyanyi - Judul" atau cukup "Judul"
                // Contoh: "Last Child Duka" atau "Duka"
                let artist = '';
                let title = rawQuery;

                if (rawQuery.includes('-')) {
                    const parts = rawQuery.split('-');
                    artist = parts[0].trim();
                    title = parts[1].trim();
                }

                // Jika user hanya mengetik "duka", kita arahkan langsung ke Last Child agar akurat dan tidak nyasar ke Billie Jean
                if (lowerQuery === 'duka' || lowerQuery === 'last child duka') {
                    artist = 'Last Child';
                    title = 'Duka';
                }

                // Menggunakan public API Lyrics.ovh (Format: /v1/ARTIS/JUDUL)
                let endpoint = `https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`;
                
                let response = await fetch(endpoint);
                
                // Jika pencarian spesifik artist gagal, coba cari berdasarkan lagu umum
                if (!response.ok && !rawQuery.includes('-')) {
                    // Fallback pencarian umum via endpoint suggest lyrics.ovh
                    const suggestRes = await fetch(`https://api.lyrics.ovh/suggest/${encodeURIComponent(rawQuery)}`);
                    const suggestData = await suggestRes.json();
                    
                    if (!suggestData.data || suggestData.data.length === 0) {
                        throw new Error('Lirik tidak ditemukan.');
                    }

                    // Ambil hasil teratas yang paling relevan
                    const topResult = suggestData.data[0];
                    artist = topResult.artist.name;
                    title = topResult.title;
                    
                    // Ambil lirik detailnya
                    response = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`);
                }

                if (!response.ok) {
                    throw new Error('Lirik tidak ditemukan di database.');
                }

                const data = await response.json();
                statusAlert.classList.add('hidden');

                // Render Hasil Lirik
                const card = document.createElement('div');
                card.className = "bg-slate-800 border border-slate-700 p-6 rounded-xl shadow-lg";
                
                // Format teks lirik agar enter/barisnya terbaca rapi di HTML
                const formattedLyrics = data.lyrics 
                    ? data.lyrics.replace(/\n/g, '<br>') 
                    : 'Lirik tidak tersedia.';

                card.innerHTML = `
                    <div class="mb-4 border-b border-slate-700 pb-3 flex justify-between items-start">
                        <div>
                            <h2 class="text-xl font-bold text-indigo-400 capitalize">${title}</h2>
                            <p class="text-sm text-slate-400 capitalize">Oleh: ${artist}</p>
                        </div>
                        <span class="bg-indigo-950 text-indigo-300 text-xs px-2.5 py-1 rounded-md border border-indigo-800">Lirik Ditemukan</span>
                    </div>
                    <div class="text-slate-300 text-sm leading-relaxed max-h-96 overflow-y-auto pr-2 whitespace-pre-line font-sans">
                        ${data.lyrics}
                    </div>
                `;
                resultsContainer.appendChild(card);

            } catch (error) {
                console.error(error);
                showStatus(`❌ Lirik untuk "${rawQuery}" tidak ditemukan atau terjadi kesalahan koneksi. Coba format penulisan: "Penyanyi - Judul Lagu".`, 'bg-red-950/50 border-red-600/50 text-red-300');
            }
        }

        function showStatus(message, className) {
            statusAlert.className = `mt-4 p-4 rounded-xl text-sm border ${className}`;
            statusAlert.textContent = message;
            statusAlert.classList.remove('hidden');
        }

        // Event Listener
        searchButton.addEventListener('click', handleSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSearch();
            }
        });
    </script>
</body>
</html>

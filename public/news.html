const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ topic: S.topic, recent: S.recent, saved: S.saved })); } catch (_) {} };
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = m => { if (typeof showToast === 'function') showToast(m); };
const isSaved = u => S.saved.some(x => x.u === u);

let items = [], shown = PAGE, reqId = 0;

function i18n() {
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  document.documentElement.lang = ID ? 'id' : 'en';
}
function tab(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.dataset.page === name));
  document.querySelectorAll('.bottom-nav-item,.desktop-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.target === name));
  window.scrollTo(0, 0);
}
document.querySelectorAll('.bottom-nav-item,.desktop-nav-btn').forEach(b => b.addEventListener('click', () => tab(b.dataset.target)));

// ---------- Data Fetching (GDELT via Pages Function) ----------
const safeUrl = v => { if (!v || typeof v !== 'string') return ''; try { const u = new URL(v, location.href); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (_) { return ''; } };

async function fetchNews(topic, query) {
  const langCode = ID ? 'id' : 'en';
  const key = 'dn:' + langCode + ':' + (query ? 'q:' + query : topic);
  try { const c = JSON.parse(sessionStorage.getItem(key) || 'null'); if (c && Date.now() - c.t < TTL) return c.v; } catch (_) {}
  
  const p = new URLSearchParams({ type: 'news', lang: langCode });
  if (query) p.set('q', query); else p.set('topic', TOPICS.find(o => o.k === topic)?.g || 'TOP');
  
  const r = await fetch(`${API}?${p}`); 
  if (!r.ok) throw new Error('Network error');
  
  const data = await r.json();
  if (!data.items) throw new Error('No items');

  const out = data.items.map(it => ({
    ti: it.t || '',
    u: safeUrl(it.u),
    s: it.s || 'News',
    d: '',
    i: safeUrl(it.i),
    p: it.p || ''
  })).filter(x => x.u && x.ti.length > 5);

  try { sessionStorage.setItem(key, JSON.stringify({ t: Date.now(), v: out })); } catch (_) {}
  return out;
}

async function load(more = false) {
  if (more) { shown += PAGE; renderFeed(); return; }
  const id = ++reqId;
  items = []; shown = PAGE; $('feed').innerHTML = '<div class="skel big"></div>' + '<div class="skel"></div>'.repeat(4);
  try {
    const got = await fetchNews(S.topic, S.q);
    if (id !== reqId) return;
    items = got; renderFeed();
  } catch (_) {
    if (id !== reqId) return;
    $('feed').innerHTML = `<div class="msg">${t('err')}<br><button id="retry" type="button">${t('retry')}</button></div>`;
    $('retry').onclick = () => load();
  }
}

// ---------- Format ----------
const rtf = new Intl.RelativeTimeFormat(LOC, { numeric: 'auto' });
function ago(p) {
  if (!p) return '';
  const isDate = typeof p === 'number' || /^\d{4}-\d\d-\d\d|^[A-Za-z]{3},/.test(String(p));
  const d = isDate ? new Date(p) : null;
  if (!d || isNaN(d)) return String(p);
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return t('now');
  if (s < 3600) return rtf.format(-Math.floor(s / 60), 'minute');
  if (s < 86400) return rtf.format(-Math.floor(s / 3600), 'hour');
  if (s < 604800) return rtf.format(-Math.floor(s / 86400), 'day');
  return new Intl.DateTimeFormat(LOC, { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
}
const greetPart = h => ID ? (h >= 4 && h < 11 ? 'morning' : h >= 11 && h < 15 ? 'day' : h >= 15 && h < 18 ? 'dusk' : 'night') : (h >= 5 && h < 12 ? 'morning' : h >= 12 && h < 17 ? 'day' : h >= 17 && h < 21 ? 'dusk' : 'night');

// ---------- Render ----------
const bm = (a, k, c = '') => { const on = isSaved(a.u); return `<button class="icon-btn bm${on ? ' on' : ''} ${c}" type="button" data-k="${k}" aria-label="${t(on ? 'unsave' : 'save')}">${svg('mark')}</button>`; };
const imgTag = (u, cls) => `<img src="${esc(u)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.remove()">`;
const lead = (a, k) => `<article class="lead${a.i ? '' : ' noimg'}"><a class="lead-a" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer">${a.i ? imgTag(a.i) : ''}<span class="src">${esc(a.s)}</span><b>${esc(a.ti)}</b>${a.d ? `<p>${esc(a.d)}</p>` : ''}<time>${esc(ago(a.p))}</time></a>${bm(a, k, 'lead-bm')}</article>`;
const story = (a, k) => `<article class="card story"><a class="story-a" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer"><div class="story-t"><span class="src">${esc(a.s)}</span><b>${esc(a.ti)}</b>${a.d ? `<p>${esc(a.d)}</p>` : ''}</div>${a.i ? `<div class="thumb">${imgTag(a.i)}</div>` : ''}</a><div class="story-f"><span>${esc(ago(a.p))}</span>${bm(a, k)}</div></article>`;

function renderFeed() {
  if (!items.length) { $('feed').innerHTML = `<div class="empty">${t('empty')}</div>`; return; }
  const vis = items.slice(0, shown);
  $('feed').innerHTML = lead(vis[0], 0) + vis.slice(1).map((a, i) => story(a, i + 1)).join('')
    + (shown >= items.length ? '' : `<div class="more-w"><button class="more" id="more" type="button">${t('more')}</button></div>`);
}
function renderHead() {
  const h = $('feedHead');
  if (S.q) {
    h.innerHTML = `<div class="qhead"><span>${t('resultsFor')} <b>${esc(S.q)}</b></span><button type="button" id="clrQ">${t('clear')}</button></div>`;
    $('clrQ').onclick = () => { S.q = '';$('q').value = ''; renderChips(); renderHead(); load(); };
    return;
  }
  const date = new Intl.DateTimeFormat(LOC, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
  h.innerHTML = `<div class="head"><b>${S.topic === 'top' ? t('g_' + greetPart(new Date().getHours())) : t('t_' + S.topic)}</b><span>${date}</span></div>`;
}
function renderChips() {
  $('chips').innerHTML = TOPICS.map(o => `<button class="chip${!S.q && S.topic === o.k ? ' on' : ''}" type="button" data-topic="${o.k}">${svg(o.i, 'pn')}<span>${t('t_' + o.k)}</span></button>`).join('');
}
const recentRow = (r, i) => `<div class="row" data-r="${i}">${svg('clock', 'pn')}<div class="row-t"><b>${esc(r)}</b></div><button class="icon-btn" type="button" data-del="${i}" aria-label="${t('removeRecent')}">${svg('x')}</button></div>`;
function renderExplore() {
  $('explorePage').innerHTML = `<div class="card"><div class="sec-title">${t('topics')}</div><div class="tgrid">${TOPICS.map(o => `<button class="tcard" type="button" data-topic="${o.k}">${svg(o.i)}<span>${t('t_' + o.k)}</span></button>`).join('')}</div></div>`
    + `<div class="card"><div class="card-h"><div class="sec-title">${t('recent')}</div>${S.recent.length ? `<button type="button" id="clrRecent">${t('clearAll')}</button>` : ''}</div>${S.recent.length ? S.recent.map(recentRow).join('') : `<div class="empty">${t('noRecent')}</div>`}</div>`;
  const c = $('clrRecent'); if (c) c.onclick = () => { S.recent = []; persist(); renderExplore(); };
}
function renderSaved() {
  $('savedTitle').textContent = t('savedStories');$('savedList').innerHTML = S.saved.length ? S.saved.map((a, k) => story(a, k)).join('') : `<div class="empty">${t('noSaved')}</div>`;
}
const syncBm = () => document.querySelectorAll('#feed .bm').forEach(b => { const a = items[+b.dataset.k]; if (!a) return; const on = isSaved(a.u); b.classList.toggle('on', on); b.setAttribute('aria-label', t(on ? 'unsave' : 'save')); });
function toggleSave(a) {
  if (!a) return;
  const i = S.saved.findIndex(x => x.u === a.u);
  if (i >= 0) { S.saved.splice(i, 1); toast(t('removedT')); }
  else { S.saved.unshift({ ...a }); S.saved = S.saved.slice(0, 100); toast(t('savedT')); }
  persist(); syncBm(); renderSaved();
}

// ---------- Actions ----------
function setTopic(k) { S.topic = k; S.q = ''; $('q').value = ''; persist(); renderChips(); renderHead(); tab('news'); load(); }
function run(v) {
  v = (v || '').trim(); if (!v) return;
  S.q = v; S.recent = [v, ...S.recent.filter(x => x.toLowerCase() !== v.toLowerCase())].slice(0, 8); persist();
  $('q').value = v; $('q').blur(); drop.classList.remove('show');
  renderChips(); renderHead(); renderExplore(); tab('news'); load();
}
const drop = $('drop'), q =$('q');
function showDrop() {
  const v = q.value.trim(), lv = v.toLowerCase();
  const rec = S.recent.map((r, i) => [r, i]).filter(([r]) => !v || r.toLowerCase().includes(lv));
  let h = v ? `<div class="row" data-go="1">${svg('search', 'pn')}<div class="row-t"><b>${t('searchFor')} “${esc(v)}”</b></div></div>` : '';
  if (rec.length) h += `<div class="drop-t">${t('recent')}</div>` + rec.map(([r, i]) => recentRow(r, i)).join('');
  if (!h) { drop.classList.remove('show'); return; }
  drop.innerHTML = h; drop.classList.add('show');
}
q.addEventListener('focus', showDrop);
q.addEventListener('input', showDrop);
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { drop.classList.remove('show'); q.blur(); }
  if (e.key === 'Enter') run(q.value);
});
document.addEventListener('click', e => {
  const b = e.target.closest('.bm');
  if (b) { toggleSave((b.closest('#savedList') ? S.saved : items)[+b.dataset.k]); return; }
  const del = e.target.closest('[data-del]');
  if (del) { S.recent.splice(+del.dataset.del, 1); persist(); renderExplore(); if (drop.classList.contains('show')) showDrop(); return; }
  const r = e.target.closest('[data-r]'); if (r) { run(S.recent[+r.dataset.r]); return; }
  if (e.target.closest('[data-go]')) { run(q.value); return; }
  const tp = e.target.closest('[data-topic]'); if (tp) { setTopic(tp.dataset.topic); return; }
  if (e.target.closest('#more')) { load(true); return; }
  if (!$('searchWrap').contains(e.target)) drop.classList.remove('show');
});

i18n(); renderChips(); renderHead(); renderExplore(); renderSaved(); load();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Foursquare Places + Photos Test</title>
<style>
*{box-sizing:border-box}
body{
    font-family:Arial,sans-serif;
    max-width:600px;
    margin:30px auto;
    padding:20px;
    background:#f4f4f9;
    border-radius:8px;
    box-shadow:0 4px 8px rgba(0,0,0,.1)
}
h2{text-align:center;color:#333}
.input-group{margin-bottom:15px}
label{display:block;margin-bottom:5px;font-weight:bold}
input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:4px
}
button{
    width:100%;
    padding:12px;
    background:#28a745;
    color:#fff;
    border:0;
    border-radius:4px;
    font-size:16px;
    cursor:pointer
}
button:disabled{opacity:.6;cursor:not-allowed}
#status{
    margin-top:15px;
    font-weight:bold;
    text-align:center;
    white-space:pre-line
}
#debug{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#222;
    color:#5ef75e;
    border-radius:6px;
    font-family:monospace;
    font-size:12px;
    white-space:pre-wrap;
    word-break:break-word;
    max-height:350px;
    overflow:auto
}
#result{
    display:none;
    margin-top:20px;
    text-align:center
}
#name{
    margin-bottom:10px;
    font-size:18px
}
#photo{
    max-width:100%;
    height:auto;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.2)
}
</style>
</head>

<body>

<h2>Foursquare Places + Photos</h2>

<div class="input-group">
<label>Latitude</label>
<input id="lat" value="-6.1754">
</div>

<div class="input-group">
<label>Longitude</label>
<input id="lng" value="106.8272">
</div>

<button id="btn" onclick="testFoursquare()">
Cari Tempat + Foto
</button>

<div id="status"></div>
<div id="debug"></div>

<div id="result">
    <div id="name"></div>
    <img id="photo" alt="Foto tempat">
</div>

<script>
/* =========================================================
   TEMPORARY TEST
   Gunakan Service API Key dari:
   Project → Settings → Service API Keys
   ========================================================= */

const API_KEY="1RFMPO0GKJU0UWK5JW1IFR4J1L5MS4DVWM0MXQWFW00DKIJK";

const API_BASE="https://places-api.foursquare.com";
const API_VERSION="2025-06-17";

function setStatus(message,color="#555"){
    const el=document.getElementById("status");
    el.textContent=message;
    el.style.color=color;
}

function debug(message){
    const box=document.getElementById("debug");
    box.style.display="block";
    box.textContent+=message+"\n";
    box.scrollTop=box.scrollHeight;
}

async function request(url){

    debug("================================");
    debug("REQUEST:");
    debug(url);

    const response=await fetch(url,{
        method:"GET",
        headers:{
            "Accept":"application/json",
            "Authorization":"Bearer "+API_KEY,
            "X-Places-Api-Version":API_VERSION
        }
    });

    const raw=await response.text();

    debug("\nHTTP STATUS: "+response.status);
    debug("RAW RESPONSE:");
    debug(raw||"(empty)");

    let data;

    try{
        data=raw?JSON.parse(raw):null;
    }catch{
        data=raw;
    }

    if(!response.ok){

        let detail="HTTP "+response.status;

        if(typeof data==="string"&&data){
            detail+="\n"+data;
        }else if(data){
            detail+="\n"+JSON.stringify(data,null,2);
        }

        throw new Error(detail);
    }

    return data;
}

async function testFoursquare(){

    const lat=document.getElementById("lat").value.trim();
    const lng=document.getElementById("lng").value.trim();

    const btn=document.getElementById("btn");
    const result=document.getElementById("result");
    const name=document.getElementById("name");
    const photo=document.getElementById("photo");

    document.getElementById("debug").textContent="";
    document.getElementById("debug").style.display="none";

    result.style.display="none";
    photo.removeAttribute("src");

    if(
        !API_KEY||
        API_KEY==="PASTE_SERVICE_API_KEY_BARU_DI_SINI"
    ){
        setStatus(
            "⚠️ Isi Service API Key terlebih dahulu.",
            "red"
        );
        return;
    }

    const latitude=Number(lat);
    const longitude=Number(lng);

    if(
        !Number.isFinite(latitude)||
        !Number.isFinite(longitude)||
        latitude<-90||
        latitude>90||
        longitude<-180||
        longitude>180
    ){
        setStatus("⚠️ Koordinat tidak valid.","red");
        return;
    }

    btn.disabled=true;
    btn.textContent="⏳ Mencari...";

    try{

        /*
         * =====================================================
         * STEP 1 — SEARCH PLACE
         * =====================================================
         */

        setStatus("⏳ Mencari tempat terdekat...");

        const searchUrl=
            API_BASE+
            "/places/search?"+
            "ll="+encodeURIComponent(
                latitude+","+longitude
            )+
            "&radius=150"+
            "&limit=1";

        const searchData=await request(searchUrl);

        if(
            !searchData||
            !Array.isArray(searchData.results)||
            !searchData.results.length
        ){

            setStatus(
                "❌ Tidak ada tempat dalam radius 150 meter.",
                "red"
            );

            return;
        }

        const place=searchData.results[0];

        const fsqId=place.fsq_id;
        const placeName=place.name||"Tanpa nama";

        debug("\nTEMPAT:");
        debug("Nama: "+placeName);
        debug("FSQ ID: "+fsqId);

        /*
         * =====================================================
         * STEP 2 — AMBIL FOTO
         * =====================================================
         */

        setStatus(
            "📍 "+placeName+
            "\n⏳ Mengambil foto..."
        );

        const photoUrl=
            API_BASE+
            "/places/"+
            encodeURIComponent(fsqId)+
            "/photos?limit=1";

        const photos=await request(photoUrl);

        if(
            !Array.isArray(photos)||
            !photos.length
        ){

            name.textContent=placeName;
            result.style.display="block";

            setStatus(
                "⚠️ Tempat ditemukan, tetapi tidak mempunyai foto.",
                "orange"
            );

            return;
        }

        const p=photos[0];

        debug("\nPHOTO DATA:");
        debug(JSON.stringify(p,null,2));

        if(!p.prefix||!p.suffix){

            throw new Error(
                "Data foto tidak mempunyai prefix/suffix."
            );
        }

        const imageUrl=
            p.prefix+
            "600x400"+
            p.suffix;

        debug("\nIMAGE URL:");
        debug(imageUrl);

        name.textContent=placeName;
        result.style.display="block";

        photo.onload=function(){

            setStatus(
                "✅ Tempat dan foto berhasil ditemukan!",
                "green"
            );

            debug("\nIMAGE LOAD: SUCCESS");
        };

        photo.onerror=function(){

            setStatus(
                "❌ Data foto berhasil diterima, tetapi gambar gagal dimuat.",
                "red"
            );

            debug("\nIMAGE LOAD: FAILED");
        };

        photo.src=imageUrl;

    }catch(error){

        console.error(error);

        setStatus(
            "❌ REQUEST GAGAL\n\n"+
            error.message,
            "red"
        );

        debug("\n================================");
        debug("ERROR FINAL:");
        debug(error.stack||error.message);
        debug("================================");

    }finally{

        btn.disabled=false;
        btn.textContent="Cari Tempat + Foto";
    }
}
</script>

</body>
</html>

<script>
(function(){try{var m=document.cookie.match(/(?:^|; )settings=([^;]*)/),t='system';
if(m){var raw=m[1],o;try{o=JSON.parse(decodeURIComponent(raw))}catch(e){o=JSON.parse(raw)}t=(o&&o.theme)||'system'}
if(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..1000&display=swap" rel="stylesheet">
<style>
:root{--primary:#1a73e8;--bg:#f8f9fa;--surface:#ffffff;--text-main:#1f1f1f;--text-muted:#5f6368;--border-color:rgba(0,0,0,.08);--hover:rgba(0,0,0,.04);--line:rgba(0,0,0,.08);--accent:#1b6ef3;--accent-soft:#eef4ff;--text:#1a1d20;--muted:#4f5862;--pill-active:rgba(26,115,232,.12);--press:rgba(128,128,128,.1)}
body.dark,:root.dark{--primary:#8ab4f8;--bg:#121418;--surface:#1b1e24;--text-main:#e8eaed;--text-muted:#9aa0a6;--border-color:rgba(255,255,255,.12);--hover:rgba(255,255,255,.06);--line:#2b2f38;--accent:#7baaf7;--accent-soft:rgba(138,180,248,.12);--text:#f1f3f7;--muted:#b0b8c1;--pill-active:rgba(138,180,248,.18);--press:rgba(128,128,128,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Google Sans Flex',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible{outline:none!important}
svg{fill:currentColor;flex-shrink:0}
#map{position:absolute;inset:0;z-index:1;touch-action:pan-x pan-y;background:#e5e3df}
html.dark #map,body.dark #map{background:#1d2026}
html.dark .tiles-road,body.dark .tiles-road,html.dark .ph .mp img,body.dark .ph .mp img{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.75)}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;z-index:1000;padding:0 16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.sbox{position:relative;pointer-events:auto}
.search-box{height:52px;background:var(--surface);border-radius:28px;display:flex;align-items:center;padding:0 8px 0 7px;box-shadow:0 2px 10px rgba(0,0,0,.2);gap:8px}
.burger-btn{width:38px;height:38px;border:0;background:rgba(26,115,232,.1);border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;flex-shrink:0;transition:background .2s}
body.dark .burger-btn{background:rgba(138,180,248,.12)}.burger-btn:hover{background:rgba(26,115,232,.18)}
.burger-btn span{display:block;height:2px;width:16px;background:var(--primary);border-radius:2px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s}
.burger-btn span:nth-child(2){width:10px;align-self:flex-start;margin-left:11px}
.search-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--text)}
.search-input::placeholder{color:var(--muted);opacity:.8}
.icon-btn{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:none;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn:active{background:var(--press)}.icon-btn svg{width:20px;height:20px}
.drop{position:absolute;top:58px;left:0;right:0;background:var(--surface);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.22);max-height:320px;overflow-y:auto;display:none;z-index:1001;padding:6px}
.drop-t{padding:8px 12px 4px;font-size:12px;color:var(--muted)}
.s-item{padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;border-radius:12px}
.s-item:hover,.s-item:active{background:var(--hover)}.s-item svg{width:20px;height:20px;color:var(--muted)}
.s-info,.r-info{flex:1;min-width:0}
.t1{font-size:14px;font-weight:550;color:var(--text)}.t2{font-size:12px;color:var(--muted);margin-top:2px}
.chips{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18);border:1px solid var(--line);flex-shrink:0;transition:transform .12s,background .15s,color .15s}
.chip:active{transform:scale(.96)}.chip svg{width:18px;height:18px;color:var(--muted)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}.chip.on svg{color:var(--accent)}

.fab-group{position:absolute;right:16px;bottom:356px;z-index:998;display:flex;flex-direction:column;gap:12px;align-items:center;transition:bottom .32s cubic-bezier(.2,.8,.2,1)}
.fab{width:48px;height:48px;border-radius:50%;background:var(--surface);border:0;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s}
.fab:active,.fab.clicked{transform:scale(.86)}.fab svg{width:24px;height:24px}
.fab.directions{background:var(--accent);color:#fff;width:54px;height:54px;border-radius:16px}
@media (max-height:720px) and (max-width:767px){.fab-group{gap:8px}.fab{width:42px;height:42px}.fab svg{width:22px;height:22px}.fab.directions{width:46px;height:46px}}

.bottom-sheet{position:absolute;bottom:0;left:0;right:0;z-index:999;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.16);height:295px;display:flex;flex-direction:column;transition:height .32s cubic-bezier(.2,.8,.2,1),border-radius .25s;overflow:hidden}
.sheet-handle-area{height:34px;padding:10px 16px 8px;display:flex;align-items:center;justify-content:center;cursor:grab;flex-shrink:0;touch-action:none;position:relative}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:2px;filter:brightness(.9)}
.panel-close,.saved-close{border:0;border-radius:50%;background:var(--hover);color:var(--muted);display:none;align-items:center;justify-content:center}
.panel-close{width:32px;height:32px;position:absolute;right:16px;top:8px;z-index:10}.panel-close svg{width:18px;height:18px}
.saved-close{width:40px;height:40px;margin-left:auto}.saved-close svg{width:21px;height:21px}
.panel-close:active,.saved-close:active{background:var(--press)}
.saved-mode{z-index:1100}
.saved-mode .sheet-handle-area{height:58px;padding:10px 16px;justify-content:space-between}
.saved-mode .sheet-handle{opacity:0}.saved-mode .saved-close{display:flex}.saved-mode .panel-close{display:none!important}
.saved-mode #sheet-title{font-size:22px;margin-bottom:10px}
.sheet-content{flex:1;min-height:0;overflow-y:auto;padding:0 16px 12px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#sheet-title{font-size:19px;font-weight:700;color:var(--text);margin-bottom:4px;padding-right:36px;letter-spacing:-.2px}
.hint{font-size:13px;color:var(--muted);line-height:1.5}.credit{font-size:10.5px;color:var(--muted);opacity:.75;margin-top:12px}
@keyframes fo{to{opacity:0;transform:translateY(5px)}}@keyframes fi{from{opacity:0;transform:translateY(5px)}}
.sheet-content.switching-out{animation:fo .14s ease forwards}.sheet-content.switching-in{animation:fi .2s ease}

.bottom-sheet:has(.pd) #sheet-title,.bottom-sheet:has(.pd) .panel-close{display:none!important}
.sheet-content{overflow-anchor:none}
.pd-head{display:flex;align-items:flex-start;gap:12px;padding-top:2px}
.pd-title{flex:1;min-width:0;font-size:22px;font-weight:700;line-height:1.22;letter-spacing:-.3px;color:var(--text);padding-top:4px;word-break:break-word}
.pd-acts{display:flex;gap:8px;flex-shrink:0}
.rb{width:40px;height:40px;border:0;border-radius:50%;background:var(--hover);color:var(--text);display:flex;align-items:center;justify-content:center}
.rb:active{background:var(--press)}.rb svg{width:21px;height:21px}.rb.on{background:var(--accent-soft);color:var(--accent)}
.pd-sub{font-size:14px;color:var(--muted);margin-top:6px}
.pd-open{font-size:14px;margin-top:4px;color:var(--muted)}
.pd-open b{font-weight:650}.pd-open b.on{color:#1e8e3e}.pd-open b.off{color:#d93025}
.pd-pills{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 2px;scrollbar-width:none;touch-action:pan-x pan-y}
.pd-pills::-webkit-scrollbar{display:none}
.pd-pills .btn{flex-shrink:0;height:36px;padding:0 14px;border:0;font-weight:600;font-size:14px;white-space:nowrap;gap:7px;border-radius:20px}.pd-pills .btn svg{width:18px;height:18px}
.pd-pills .btn.tint{background:var(--accent-soft);color:var(--accent)}
.route-modes{display:flex;gap:7px;overflow-x:auto;margin:0 0 14px;padding:2px 0 5px;scrollbar-width:none}.route-modes::-webkit-scrollbar{display:none}.route-mode{min-width:74px;flex:1;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:550;white-space:nowrap}.route-mode svg{width:21px;height:21px}.route-mode.active{background:var(--accent-soft);color:var(--accent);border-color:transparent}.route-action{width:100%;height:42px;border:0;border-radius:22px;background:var(--accent);color:#fff;font-size:16px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px}.route-action svg{width:19px;height:19px}
.pd-photos{display:flex;gap:8px;overflow-x:auto;margin:16px -16px 0;padding:0 16px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 16px;touch-action:pan-x pan-y}
.pd-photos::-webkit-scrollbar{display:none}
.pd-slide{position:relative;flex:0 0 78%;max-width:300px;height:176px;border-radius:16px;overflow:hidden;scroll-snap-align:start}
.pd-slide .ph{width:100%;height:100%}.pd-slide .pp{width:32px;height:32px}
.pd-card{margin-top:16px;border:1px solid var(--line);border-radius:18px;padding:2px 14px}
.pd-card .info{padding:12px 0;border-top:1px solid var(--line)}.pd-card .info:first-child{border-top:0}

.sheet-nav{height:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);display:flex;flex-shrink:0}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:0}
.bottom-nav-pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.bottom-nav-pill svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav-item.active .bottom-nav-pill{background:var(--pill-active);color:var(--accent)}.bottom-nav-item.active svg{stroke-width:2.2}
.bottom-nav-label{font-size:11px;line-height:1;font-weight:500;color:var(--muted)}.bottom-nav-item.active .bottom-nav-label{color:var(--accent);font-weight:650}

.w-loc{display:flex;align-items:center;gap:6px;margin:0 0 14px;font-size:12.5px;color:var(--muted);min-width:0}
.w-loc svg{width:15px;height:15px;color:var(--accent)}
.w-loc span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-row{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 16px;touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.pop-row::-webkit-scrollbar{display:none}
.pop{flex:0 0 150px;width:150px;scroll-snap-align:start;cursor:pointer;min-width:0}
.pop .ph{width:150px;height:104px;border-radius:18px;transition:transform .15s}
.pop:active .ph{transform:scale(.97)}
.pop .pp{width:26px;height:26px}
.pop-t{font-size:13.5px;font-weight:600;color:var(--text);margin-top:8px}
.pop-s{font-size:12px;color:var(--muted);margin-top:2px}
.sec-t{font-size:14px;font-weight:650;margin:14px 0 2px;color:var(--text)}

.result-item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;display:flex;align-items:center;gap:12px}
.result-item:active{background:var(--hover)}.result-item svg{width:20px;height:20px;color:var(--muted)}
.result-thumb{width:56px;height:56px;border-radius:14px;flex-shrink:0}
.dist{font-size:12px;color:var(--accent);font-weight:550;flex-shrink:0}
.photo-container{position:relative;width:100%;height:190px;border-radius:16px;overflow:hidden;margin:10px 0;background:var(--hover)}
.photo-container .ph{width:100%;height:100%}.photo-container .pp{width:34px;height:34px}
.ph{position:relative;overflow:hidden;background:var(--hover);isolation:isolate}
.ph .mp{position:absolute;left:50%;top:50%;width:512px;height:512px;pointer-events:none;transition:opacity .4s}
.ph .mp img{position:absolute;width:256px;height:256px;display:block;max-width:none;user-select:none}
.ph .pp{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-92%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.55));transition:opacity .3s}
.ph .pp svg{width:100%;height:100%;color:#ea4335}
.ph .real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.ph.has .real{opacity:1}.ph.has .mp,.ph.has .pp{opacity:0}
.photo-badge{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:500;backdrop-filter:blur(4px)}
.p-sub{font-size:13px;color:var(--muted)}.p-open{display:inline-block;margin-top:8px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:12px}
.p-open.on{background:rgba(30,142,62,.14);color:#1e8e3e}.p-open.off{background:rgba(217,48,37,.12);color:#d93025}
.info{display:flex;gap:12px;align-items:flex-start;padding:9px 0;font-size:13px;line-height:1.45;word-break:break-word}
.info svg{width:19px;height:19px;color:var(--accent);margin-top:1px}.info a{color:var(--accent);text-decoration:none}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:20px;padding:9px 16px;font-size:13px;font-weight:550;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,background .12s}
.btn:active{transform:scale(.96)}.btn svg{width:18px;height:18px}.btn[hidden]{display:none}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{background:#d93025;color:#fff;border-color:#d93025}.btn.saved{background:var(--accent-soft);border-color:transparent}
.location-fallback{padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.location-fallback b{display:block;font-size:14px;margin-bottom:4px}.location-fallback p{font-size:12.5px;color:var(--muted);line-height:1.5}
.saved-empty{text-align:center;padding:28px 10px}.saved-empty .ic{width:56px;height:56px;border-radius:50%;background:var(--hover);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--muted)}
.saved-empty .ic svg{width:28px;height:28px}.saved-empty b{display:block;font-size:16px;margin-bottom:5px}
.saved-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:transform .3s,opacity .3s;overflow:hidden}
.saved-item:active{background:var(--hover)}.saved-item.removing{opacity:0;transform:translateX(100%)}
.saved-pin{width:38px;height:38px;border-radius:12px;background:var(--pill-active);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}.saved-pin svg{width:20px;height:20px}
.saved-remove{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}.saved-remove:active{background:var(--press)}.saved-remove svg{width:20px;height:20px}

.recent-remove{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto}
.recent-remove:active{background:var(--press)}.recent-remove svg{width:18px;height:18px}

.mk svg{width:34px;height:42px;color:#ea4335;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));transition:transform .15s;transform-origin:50% 100%}
.mk.sel svg{transform:scale(1.25);color:#d93025}
.user-dot{width:20px;height:20px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 2px 8px rgba(0,0,0,.4)}
.user-dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:rgba(26,115,232,.22);animation:pulse 2s ease-out infinite;z-index:-1}
@keyframes pulse{from{transform:scale(.5);opacity:1}to{transform:scale(1.4);opacity:0}}

.nav-banner{display:none;position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;z-index:1000;flex-direction:column;align-items:flex-start;color:#fff}
.nb-main{width:100%;background:#1a73e8;border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);position:relative;z-index:1}
.nb-then{background:#1a73e8;border-radius:0 0 18px 18px;padding:14px 16px 8px;margin:-8px 0 0 8px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.nb-then[hidden]{display:none}.nb-then svg{width:22px;height:22px;fill:#fff}
.nb-ico{width:52px;height:52px;display:flex;align-items:center;justify-content:center;flex-shrink:0}.nb-ico svg{width:46px;height:46px;fill:#fff;transition:transform .3s}
.nb-dist{font-size:26px;font-weight:700;line-height:1.1}.nb-text{font-size:16px;opacity:.95;margin-top:3px;line-height:1.25}
body.navigating .nav-banner{display:flex}body.navigating .top,body.navigating .sheet-nav,body.navigating .panel-close{display:none!important}
body.navigating #sheet-title{display:none}body.navigating .sheet-content{overflow:hidden}
.nv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 4px 0}
.nv-btn{width:56px;height:56px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nv-btn:active{background:var(--press)}.nv-btn svg{width:26px;height:26px}.nv-btn.go{color:var(--accent)}.nv-btn[hidden]{visibility:hidden}
.nv-mid{flex:1;text-align:center;min-width:0}
.nv-dur{font-size:30px;font-weight:700;color:#1a73e8;line-height:1.1}
.nv-sub{font-size:15px;color:var(--muted);margin-top:4px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:2100;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s}
.modal-overlay.active{display:flex;opacity:1}
.modal-box{background:var(--surface);border-radius:24px;width:100%;max-width:300px;padding:22px 20px 16px;box-shadow:0 20px 44px rgba(0,0,0,.25);transform:scale(.95);transition:transform .2s}
.modal-overlay.active .modal-box{transform:scale(1)}
.modal-title{font-size:17px;font-weight:700;margin-bottom:6px}.modal-desc{font-size:14px;color:var(--muted);line-height:1.45;margin-bottom:18px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-btn{border:0;padding:11px 14px;border-radius:14px;font-size:14px;font-weight:550}
.modal-btn:active{transform:scale(.97)}.modal-btn.cancel{background:var(--hover)}.modal-btn.ok{background:var(--accent);color:#fff}.modal-btn.delete{background:#d93025;color:#fff}

async function fetchWithTimeout(url,opts={},ms=15000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  if(opts.signal)opts.signal.addEventListener('abort',()=>c.abort());
  try{return await fetch(url,{...opts,signal:c.signal})}finally{clearTimeout(t)}
}
async function fetchJSON(url,opts,ms){const r=await fetchWithTimeout(url,opts,ms);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

function isInIndonesia(lat,lon){const la=Number(lat),lo=Number(lon);return Number.isFinite(la)&&Number.isFinite(lo)&&la>=-11.5&&la<=6.5&&lo>=94.5&&lo<=141.5;}
function validateCoord(lat,lon){return isInIndonesia(lat,lon);}

function fromPhoton(f){
  const p=f.properties||{},[lon,lat]=f.geometry?.coordinates||[];
  if(!validateCoord(lat,lon))return null;
  const street=[p.street,p.housenumber].filter(Boolean).join(' ');
  return{name:p.name||street||p.city||'Tempat tanpa nama',lat:Number(lat),lon:Number(lon),
    addr:[p.name&&street,p.district||p.locality,p.city||p.county,p.state].filter(Boolean).join(', '),
    tags:{category:p.osm_value||'',postcode:p.postcode||''},place_id:`ph_${p.osm_type||''}${p.osm_id||''}`};
}
async function photon(q,limit,signal){
  const[lat,lon]=origin();
  const d=await fetchJSON(`${PHOTON}/api/?q=${encodeURIComponent(q)}&limit=${limit}&lat=${lat.toFixed(4)}&lon=${lon.toFixed(4)}&location_bias_scale=0.35&bbox=${ID_BBOX}&bounded=1`,{signal},12000);
  return(d.features||[]).map(fromPhoton).filter(Boolean);
}
function fromNominatim(it){
  const la=parseFloat(it.lat),lo=parseFloat(it.lon);
  if(!validateCoord(la,lo))return null;
  return{name:it.name||it.display_name?.split(',')[0]||'Tempat tanpa nama',lat:la,lon:lo,
    tags:it.extratags||{},addr:it.display_name||'',place_id:it.place_id?`nom_${it.place_id}`:''};
}
async function nominatim(q,limit,signal){
  const[lat,lon]=origin(),d=.3;
  const list=await fetchJSON(`https://nominatim.openstreetmap.org/search?format=json&extratags=1&limit=${limit}&countrycodes=id&q=${encodeURIComponent(q)}&viewbox=${lon-d},${lat+d},${lon+d},${lat-d}&bounded=0`,{signal},20000);
  return(Array.isArray(list)?list:[]).map(fromNominatim).filter(Boolean);
}
async function searchPlaces(q,limit,signal){
  try{const r=await photon(q,limit,signal);if(r.length)return r}catch(e){if(e.name==='AbortError')throw e}
  return nominatim(q,limit,signal);
}

const GENERIC=new Set(['restoran','restaurant','cafe','kafe','kedai','kopi','coffee','shop','hotel','motel','spbu','pertamina','shell','jalan','toko','warung','rumah','makan','the','dan','and','cabang','indonesia']);
const NOGEO=new Set(['restaurant','fast_food','cafe','fuel','atm','bank','parking','restoran','kedai kopi','spbu']);
const toks=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!GENERIC.has(w));

function tileView(p,z){
  const n=Math.pow(2,z),la=Math.max(-85,Math.min(85,Number(p.lat)))*Math.PI/180;
  const px=(Number(p.lon)+180)/360*n*256,py=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n*256;
  const tx=Math.floor((px-128)/256),ty=Math.floor((py-128)/256);
  let h='';
  for(let i=0;i<2;i++)for(let j=0;j<2;j++)h+=`<img src="https://mt${(i+j)%4}.google.com/vt/lyrs=m&hl=id&x=${tx+j}&y=${ty+i}&z=${z}" alt="" draggable="false" loading="lazy" style="left:${j*256}px;top:${i*256}px">`;
  return`<div class="mp" style="margin-left:${(tx*256-px).toFixed(1)}px;margin-top:${(ty*256-py).toFixed(1)}px">${h}</div>`;
}
const photoLabel=u=>/wikimedia|wikipedia/i.test(u)?'Foto · Wikimedia':'Foto lokasi';
function phHTML(p,cls='',z=18){
  const k=placeKey(p);phReg.set(k,p);
  const u=cls.split(' ').includes('np')?'':(phStore[k]||'');
  return`<div class="ph ${cls}${u?' has':''}" data-pk="${esc(k)}">${tileView(p,z)}<span class="pp">${ic('pin')}</span>${u?`<img class="real" alt="" referrerpolicy="no-referrer" src="${esc(u)}" onerror="this.parentElement.classList.remove('has');this.remove()">`:''}</div>`;
}
async function wikiSummary(lang,title){
  const d=await fetchJSON(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title.trim().replace(/ /g,'_'))}`,{},8000);
  const th=d?.thumbnail?.source||'';if(!th)return'';
  return(d.originalimage?.width>=640&&/\/thumb\//.test(th))?th.replace(/\/\d+px-/,'/640px-'):th;
}
async function wikiGeo(lang,p){
  const want=toks(p.name);if(!want.length)return'';
  const d=await fetchJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=geosearch&ggscoord=${p.lat}%7C${p.lon}&ggsradius=250&ggslimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=640`,{},8000);
  for(const pg of Object.values(d?.query?.pages||{})){
    if(!pg.thumbnail?.source)continue;
    if(toks(pg.title).some(w=>want.includes(w)))return pg.thumbnail.source;
  }
  return'';
}
async function resolvePhoto(p){
  const k=placeKey(p),t=p.tags||{};
  if(phStore[k])return phStore[k];
  if(phMem.has(k))return phMem.get(k);
  let url='';
  try{
    const img=String(t.image||'');
    if(/^https?:\/\//i.test(img))url=img.replace(/^http:\/\//i,'https://');
    else{
      const wc=t.wikimedia_commons||(/^File:/i.test(img)?img:'');
      if(/^File:/i.test(wc))url='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(wc.slice(5))+'?width=640';
    }
    if(!url&&t.wikipedia){
      const m=String(t.wikipedia).match(/^([a-z-]{2,8}):(.+)$/i);
      if(m)url=await wikiSummary(m[1].toLowerCase(),m[2]).catch(()=>'');
    }
    if(!url&&!NOGEO.has(String(t.category||'').toLowerCase())){
      url=await wikiGeo('id',p).catch(()=>'');
      if(!url)url=await wikiGeo('en',p).catch(()=>'');
    }
  }catch(_){}
  phMem.set(k,url);
  if(url){
    phStore[k]=url;
    const ks=Object.keys(phStore);if(ks.length>150)ks.slice(0,ks.length-150).forEach(x=>delete phStore[x]);
    store.set(PHOTO_KEY,phStore);
  }
  return url;
}
const phQ=[];let phBusy=0;
function phPump(){
  while(phBusy<3&&phQ.length){phBusy++;phQ.shift()().catch(()=>{}).finally(()=>{phBusy--;phPump()})}
}
function hydratePhotos(root,first){
  root.querySelectorAll('.ph:not([data-h])').forEach(el=>{
    el.dataset.h='1';
    const p=phReg.get(el.dataset.pk);if(!p||el.classList.contains('np')||el.querySelector('.real'))return;
    const job=async()=>{
      const url=await resolvePhoto(p);
      if(!url||!el.isConnected)return;
      await new Promise(res=>{
        const im=new Image();im.className='real';im.alt='';im.referrerPolicy='no-referrer';
        im.onload=()=>{
          if(el.isConnected){
            el.appendChild(im);requestAnimationFrame(()=>el.classList.add('has'));
            const b=el.parentElement?.querySelector('.photo-badge');
            if(b)b.textContent=photoLabel(url);
          }
          res();
        };
        im.onerror=res;im.src=url;
      });
    };
    first?phQ.unshift(job):phQ.push(job);
  });
  phPump();
}

const getSaved=()=>{

function placeKey(p){

  return p.place_id?'place:'+p.place_id:'coord:'+Number(p.lat).toFixed(6)+','+Number(p.lon).toFixed(6);
}

const slim=p=>({name:p.name||'Tempat tanpa nama',lat:Number(p.lat),lon:Number(p.lon),addr:p.addr||'',tags:p.tags||{},place_id:p.place_id||''});

let userMarker=null,accCircle=null,watchId=null,firstFix=true,highAcc=false;
let disp=null,from=null,target=null,t0=0,dur=500,raf=0,dispB=0,tgtB=0,following=false,nav=null;

function ensureUser(){
  if(userMarker)return;
  userMarker=L.marker(userCoords,{icon:L.divIcon({className:'',html:'<div class="user-dot"></div>',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:900,interactive:false}).addTo(map);
  accCircle=L.circle(userCoords,{radius:0,weight:0,fillColor:'#1a73e8',fillOpacity:.12,interactive:false}).addTo(map);
}
function onFix(p,moveMap){
  if(!p||!p.coords||!validateCoord(p.coords.latitude,p.coords.longitude))return;
  const c=[p.coords.latitude,p.coords.longitude];
  userCoords=c;located=true;ensureUser();
  accCircle.setRadius(Math.min(p.coords.accuracy||0,300));
  if(!disp)disp=c.slice();
  from=disp.slice();target=c;t0=performance.now();dur=nav?900:500;
  if(nav&&Number.isFinite(p.coords.heading)&&(p.coords.speed||0)>1)tgtB=p.coords.heading;
  if(firstFix){firstFix=false;if(moveMap)map.flyTo(c,16,{duration:1.2});if(mode==='explore'&&!currentPlace&&$('w-loc')){document.querySelector('.location-fallback')?.remove();fillWelcome()}}
  if(nav)navUpdate(c);
  kick();
}
function frame(now){
  raf=0;if(!userMarker||!from||!target)return;
  const k=Math.min(1,(now-t0)/dur);
  disp=[from[0]+(target[0]-from[0])*k,from[1]+(target[1]-from[1])*k];
  userMarker.setLatLng(disp);accCircle.setLatLng(disp);
  if(nav&&following){
    const d=((tgtB-dispB+540)%360)-180;dispB=(dispB+d*.12+360)%360;
    map.setBearing(dispB);map.panTo(disp,{animate:false});
  }
  if(k<1||(nav&&following))raf=requestAnimationFrame(frame);
}
const kick=()=>{if(!raf)raf=requestAnimationFrame(frame)};

function startWatch(high,moveMap=false){
  if(!navigator.geolocation){showLocationFallback();return}
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  highAcc=high;
  const options={enableHighAccuracy:high,maximumAge:high?1000:10000,timeout:15000};
  const handleSuccess=p=>onFix(p,moveMap||firstFix);
  const handleError=err=>{
    if(high){
      watchId=navigator.geolocation.watchPosition(handleSuccess,()=>{if(!located)showLocationFallback()},{enableHighAccuracy:false,maximumAge:10000,timeout:15000});
    }else if(!located){
      showLocationFallback();
    }
  };
  watchId=navigator.geolocation.watchPosition(handleSuccess,handleError,options);
}

let northAnim=0;
function alignNorth(){
  cancelAnimationFrame(northAnim);
  const f=map.getBearing(),delta=((-f+540)%360)-180;
  if(Math.abs(delta)<.5){map.setBearing(0);dispB=0;tgtB=0;return}
  const t=performance.now(),step=now=>{const p=Math.min(1,(now-t)/450),e=1-Math.pow(1-p,3);map.setBearing(p<1?f+delta*e:0);if(p<1)northAnim=requestAnimationFrame(step);else{dispB=0;tgtB=0}};
  northAnim=requestAnimationFrame(step);
}
$('btn-north').onclick=()=>{alignNorth();if(nav)following=false};
map.getContainer().addEventListener('touchstart',()=>cancelAnimationFrame(northAnim),{passive:true});

const CATS={
  'restoran':{label:'Restoran',filters:['["amenity"="restaurant"]','["amenity"="fast_food"]'],queries:['restaurant','restoran','fast food']},
  'kedai kopi':{label:'Kedai Kopi',filters:['["amenity"="cafe"]'],queries:['cafe','kedai kopi','coffee shop']},
  'spbu':{label:'SPBU',filters:['["amenity"="fuel"]'],queries:['SPBU','pom bensin','gas station']},
  'hotel':{label:'Hotel',filters:['["tourism"="hotel"]','["tourism"="motel"]'],queries:['hotel','motel']}
};
const TYPES={restaurant:'Restoran',fast_food:'Makanan cepat saji',cafe:'Kedai kopi',fuel:'SPBU',hotel:'Hotel',motel:'Motel',guest_house:'Penginapan',hostel:'Hostel',bank:'Bank',atm:'ATM',pharmacy:'Apotek',hospital:'Rumah sakit',clinic:'Klinik',supermarket:'Supermarket',convenience:'Minimarket',mall:'Pusat perbelanjaan',place_of_worship:'Tempat ibadah',school:'Sekolah',university:'Universitas',parking:'Parkir',bus_station:'Terminal',station:'Stasiun',landmark:'Landmark',attraction:'Wisata',museum:'Museum',stadium:'Stadion',theme_park:'Taman rekreasi',zoo:'Kebun binatang',park:'Taman',mosque:'Masjid'};
function placeType(p){const t=p.tags||{},k=String(t.category||t.amenity||t.tourism||t.shop||'').toLowerCase();return CATS[k]?.label||TYPES[k]||''}

function fromOverpass(el){
  const t=el.tags||{},lat=el.lat??el.center?.lat,lon=el.lon??el.center?.lon;
  if(!validateCoord(lat,lon)||!t.name)return null;
  const addr=[t['addr:housenumber'],t['addr:street'],t['addr:suburb']||t['addr:village']||t['addr:town']||t['addr:city']].filter(Boolean).join(', ');
  return{name:t.name,lat:Number(lat),lon:Number(lon),tags:t,addr:addr||t['addr:full']||'',place_id:el.id?`osm_${el.type||'node'}_${el.id}`:''};
}
const fetchOverpass=q=>Promise.any(OVERPASS.map(async ep=>{
  const r=await fetchWithTimeout(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(q)},25000);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();if(!Array.isArray(d.elements))throw new Error('bad');return d.elements;
})).catch(e=>{throw e.errors?.[0]||e});

function preparePlaces(list,lat,lon){
  const seen=new Set();
  return list.filter(p=>{if(!p||!p.name||!validateCoord(p.lat,p.lon))return false;const k=placeKey(p);if(seen.has(k))return false;seen.add(k);return true})
    .map(p=>({...p,d:Number.isFinite(+p.d)?+p.d:map.distance([lat,lon],[p.lat,p.lon])})).sort((a,b)=>a.d-b.d).slice(0,30);
}
async function fetchPlacesAPI(key,lat,lon){
  const d=await fetchJSON(`${PLACES_API}?${new URLSearchParams({lat:lat.toFixed(6),lon:lon.toFixed(6),category:key})}`,{headers:{Accept:'application/json'}},15000);
  if(!d||!Array.isArray(d.places))throw new Error('Invalid Places API response');
  return preparePlaces(d.places.map(it=>{
    const la=Number(it?.lat),lo=Number(it?.lon);if(!it?.name||!validateCoord(la,lo))return null;
    return{name:String(it.name),lat:la,lon:lo,addr:it.address||'',place_id:it.id?`geo_${it.id}`:`geo_${la}_${lo}`,d:Number.isFinite(+it.distance_m)?+it.distance_m:undefined,
      tags:{category:it.category||key,phone:it.phone||'',website:it.website||'',opening_hours:it.opening_hours||'',image:it.image||''}};
  }).filter(Boolean),lat,lon);
}
async function searchNearbyFallback(cat,lat,lon){
  const out=[];
  for(const q of cat.queries){try{out.push(...await photon(q,15))}catch(e){if(e.name!=='AbortError')throw e}if(out.length>=30)break}
  return preparePlaces(out,lat,lon);
}
function exitSaved(){if(mode!=='saved')return;mode='explore';$('sheet').classList.remove('saved-mode');syncTabs()}
const syncTabs=()=>{$('tab-explore').classList.toggle('active',mode==='explore');$('tab-saved').classList.toggle('active',mode==='saved')};
function setChip(key){document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.cat===key))}

async function searchNearby(key){
  const cat=CATS[key];if(!cat)return;
  const id=++catReq,[lat,lon]=origin();
  $('search-input').value=cat.label;updateClear();$('suggestions').style.display='none';
  exitSaved();setChip(key);
  $('panel-close').style.display='flex';$('sheet-title').textContent=cat.label+' terdekat';$('sheet-detail').innerHTML='<div class="hint">Mencari tempat di sekitar kamu…</div>';
  setSheet(300);routeLayer.clearLayers();
  try{
    let places=[];
    try{places=await fetchPlacesAPI(key,lat,lon)}
    catch(e1){
      if(id!==catReq)return;
      $('sheet-detail').innerHTML='<div class="hint">Mencoba sumber data OpenStreetMap…</div>';
      try{
        const q=`[out:json][timeout:25];(${cat.filters.map(f=>`nwr${f}(around:${RADIUS},${lat},${lon});`).join('')});out center tags;`;
        places=preparePlaces((await fetchOverpass(q)).map(fromOverpass).filter(Boolean),lat,lon);
      }catch(e2){if(id!==catReq)return;places=await searchNearbyFallback(cat,lat,lon)}
    }
    if(id!==catReq)return;
    if(!places.length){$('sheet-detail').innerHTML=`<div class="hint">Tidak ada ${esc(cat.label.toLowerCase())} terdata dalam radius ${RADIUS/1000} km dari posisi ini.<br><br>Aktifkan lokasi atau geser peta ke area lain lalu ketuk ${esc(cat.label)} lagi.</div>`;return}
    showList(places,cat.label);
  }catch(e){
    if(id!==catReq)return;
    $('sheet-detail').innerHTML='<div class="hint" style="color:#d93025">Pencarian tempat sedang tidak merespons.</div><div class="btns"><button class="btn primary" id="retry-category" type="button">Coba lagi</button></div>';
    $('retry-category').onclick=()=>searchNearby(key);
  }
}

async function runSearch(q){
  if(CATS[q.toLowerCase()])return searchNearby(q.toLowerCase());
  dd.style.display='none';exitSaved();setChip('');catReq++;
  if(searchAbort)searchAbort.abort();
  searchAbort=new AbortController();
  
  $('panel-close').style.display='flex';$('sheet-title').textContent=`Hasil: "${q}"`;
  $('sheet-detail').innerHTML='<div class="hint">Mencari…</div>';setSheet(300);
  try{
    const[lat,lon]=origin(),places=(await searchPlaces(q,10,searchAbort.signal)).map(p=>({...p,d:map.distance([lat,lon],[p.lat,p.lon])}));
    if(!places.length){$('sheet-detail').innerHTML='<div class="hint">Tempat tidak ditemukan di Indonesia. Deevv Maps saat ini hanya menyediakan pencarian dan peta untuk wilayah Indonesia.</div>';return}
    showList(places,q);
  }catch(err){
    if(err.name!=='AbortError')$('sheet-detail').innerHTML='<div class="hint" style="color:#d93025">Gagal terhubung ke layanan pencarian.</div>';
  }
}

    it.onclick=()=>showDetail(p);list.appendChild(it);
  });

  view={kind:'list'};lastList={places:validPlaces,label,title:$('sheet-title').textContent};

const DAYS=['Su','Mo','Tu','We','Th','Fr','Sa'];
function parseHours(oh){
  const rules=[];
  for(const rule of String(oh).split(';')){
    const mm=rule.trim().match(/^([A-Za-z,\- ]+?)\s+((?:\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}\s*,?\s*)+)$/);if(!mm)continue;
    const ds=new Set();
    for(const part of mm[1].split(',')){
      const r=part.trim().split('-'),a=DAYS.indexOf(r[0].trim().slice(0,2)),b=r[1]?DAYS.indexOf(r[1].trim().slice(0,2)):a;
      if(a<0||b<0)continue;for(let i=a;;i=(i+1)%7){ds.add(i);if(i===b)break}
    }
    if(!ds.size)continue;
    const rg=[];
    for(const t of mm[2].split(',')){
      const x=t.trim().match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);if(!x)continue;
      const st=+x[1]*60+ +x[2];let e=+x[3]*60+ +x[4];if(e<=st)e+=1440;rg.push([st,e]);
    }
    if(rg.length)rules.push({ds,rg});
  }
  return rules;
}
const DAYN=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+'.'+String(m%60).padStart(2,'0');
function openState(oh,now=new Date()){
  if(!oh)return null;
  if(/^\s*24\/7\s*$/.test(oh))return{open:true,more:'24 jam'};
  const rules=parseHours(oh);if(!rules.length)return null;
  const day=now.getDay(),m=now.getHours()*60+now.getMinutes();
  let until=-1;
  for(const r of rules){if(!r.ds.has(day))continue;for(const[a,b]of r.rg)if(m>=a&&m<b)until=Math.max(until,b)}
  if(until>=0)return{open:true,more:'tutup '+hm(until)};
  for(let off=0;off<=7;off++){
    const d=(day+off)%7;let best=-1;
    for(const r of rules){if(!r.ds.has(d))continue;for(const[a]of r.rg){if(off===0&&a<=m)continue;if(best<0||a<best)best=a}}
    if(best>=0)return{open:false,more:'Buka '+(off===0?'hari ini':off===1?'besok':DAYN[d])+' pukul '+hm(best)};
  }
  return{open:false,more:''};
}

const MOD={left:-90,right:90,'slight left':-35,'slight right':35,'sharp left':-135,'sharp right':135,uturn:180,straight:0};
const MODTXT={left:'Belok kiri',right:'Belok kanan','slight left':'Serong kiri','slight right':'Serong kanan','sharp left':'Belok tajam ke kiri','sharp right':'Belok tajam ke kanan',uturn:'Putar balik',straight:'Lurus'};
function stepText(s){
  const m=s.maneuver||{},n=s.name?` ke ${s.name}`:'';
  if(m.type==='depart')return'Mulai'+(s.name?` di ${s.name}`:'');
  if(m.type==='arrive')return'Tiba di tujuan';
  if(m.type==='roundabout'||m.type==='rotary')return`Masuk bundaran, ambil exit ke-${m.exit||1}`+n;
  if(m.type==='merge')return'Gabung'+n;
  return(MODTXT[m.modifier]||'Lanjut')+n;
}
const stepIcon=s=>s.maneuver?.type==='arrive'?ic('pin'):`<svg viewBox="0 0 24 24" style="transform:rotate(${MOD[s.maneuver?.modifier]||0}deg)"><path d="${ICON.up}"/></svg>`;

async function fetchRoutes(dest){
  if(!located||!validateCoord(userCoords[0],userCoords[1]))throw new Error('No user origin');
  if(!dest||!validateCoord(dest.lat,dest.lon))throw new Error('No valid destination');
  
  const url=`https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${dest.lon},${dest.lat}?overview=full&geometries=geojson&steps=true&alternatives=true`;
  const d=await fetchJSON(url,{},20000);
  if(!d.routes?.length)throw new Error('no route');

  return d.routes.map((rt, index) => {
    const coords=rt.geometry.coordinates.map(([x,y])=>[y,x]),cum=[0];
    for(let i=1;i<coords.length;i++)cum.push(cum[i-1]+L.latLng(coords[i-1]).distanceTo(coords[i]));
    let last=0;
    const steps=(rt.legs[0]?.steps||[]).map(s=>{
      const loc=[s.maneuver.location[1],s.maneuver.location[0]];let best=last,bd=Infinity;
      for(let k=last;k<coords.length;k++){const dd2=L.latLng(loc).distanceTo(coords[k]);if(dd2<bd){bd=dd2;best=k}if(bd<3)break}
      last=best;return{idx:best,text:stepText(s),icon:stepIcon(s),maneuver:s.maneuver};
    });
    return {dest, coords, cum, steps, dist:rt.distance, dur:rt.duration, i:0, off:0, isAlt: index > 0, index};
  });
}

let activeRoutes = [];
let activeRouteIdx = 0;

function renderRouteLines(routes, selectedIdx = 0) {
  routeLayer.clearLayers();
  activeRoutes = routes;
  activeRouteIdx = selectedIdx;

  routes.forEach((r, idx) => {
    if (idx === selectedIdx) return;
    const line = L.polyline(r.coords, {
      color: '#4285f4',
      weight: 6,
      opacity: 0.65,
      dashArray: '6, 8',
      interactive: true
    }).addTo(routeLayer);
    r.line = line;

    line.on('click', () => {
      renderRouteLines(routes, idx);
      const sel = routes[idx];
      $('sheet-title').textContent = `${fmtDur(sel.dur)} · ${fmtDist(sel.dist)}`;
      const hintEl = $('sheet-detail').querySelector('.hint');
      if(hintEl) hintEl.innerHTML = `Rute mobil menuju <b>${esc(sel.dest.name)}</b>${idx > 0 ? ' (Alternatif)' : ' (Tercepat)'}. Tiba sekitar ${clock(new Date(Date.now()+sel.dur*1000))}.`;
      toast(idx === 0 ? 'Pindah ke rute tercepat' : 'Pindah ke rute alternatif');
    });
  });

  const mainRoute = routes[selectedIdx];
  if(mainRoute && mainRoute.coords) {
    const mainLine = L.polyline(mainRoute.coords, {
      color: '#1a73e8',
      weight: 7,
      opacity: 0.95,
      interactive: true
    }).addTo(routeLayer);
    mainRoute.line = mainLine;
    fit(mainLine.getBounds(), 18);
  }
}

  $('sheet-title').textContent=`Menuju ${currentPlace?.name||r.dest.name}`;
  $('sheet-detail').innerHTML=`<div class="nv"><button class="nv-btn" id="btn-stop" type="button" aria-label="Akhiri navigasi" title="Akhiri navigasi">${ic('close')}</button>
    <div class="nv-mid"><div class="nv-dur" id="ns-dur">${fmtDur(r.dur)}</div><div class="nv-sub"><span id="ns-dist">${fmtDist(r.dist)}</span> • <span id="ns-eta">${clock(new Date(Date.now()+r.dur*1000))}</span></div></div>
    <button class="nv-btn go" id="btn-recenter" type="button" aria-label="Pusatkan" title="Pusatkan" hidden>${ic('nav')}</button></div>`;
  $('btn-recenter').onclick=()=>{following=true;$('btn-recenter').hidden=true;map.setZoom(18);kick()};$('btn-stop').onclick=()=>endNav(false);
  setSheet(132);
  dispB=map.getBearing();tgtB=dispB;
  startWatch(true,false);
  if(located){map.setView(userCoords,18,{animate:true});disp=disp||userCoords.slice()}
  navUpdate(userCoords);kick();
}
function scan(c,a,b){let best=a,bd=Infinity;for(let k=a;k<b;k++){const d=L.latLng(c).distanceTo(nav.coords[k]);if(d<bd){bd=d;best=k}}return[best,bd]}
function navUpdate(c){
  const n=nav;if(!n||!n.coords||!n.coords.length)return;
  let[best,bd]=scan(c,n.i,Math.min(n.coords.length,n.i+150));
  if(bd>60)[best,bd]=scan(c,0,n.coords.length);
  if(bd>70){if(++n.off>=3&&!n.rerouting)reroute();} else{n.off=0;n.i=Math.max(n.i,best)}
  const total=n.cum[n.cum.length-1],rem=Math.max(0,total-n.cum[n.i]),secs=n.dur*(rem/(n.dist||total||1));
  if(L.latLng(c).distanceTo(n.coords[n.coords.length-1])<25&&rem<60)return arrive();
  n.line.setLatLngs(n.coords.slice(n.i));
  const nx=n.steps.find(s=>s.idx>n.i)||n.steps[n.steps.length-1];
  if(nx){$('nb-ico').innerHTML=nx.icon;$('nb-dist').textContent=fmtDist(Math.max(0,n.cum[nx.idx]-n.cum[n.i]));$('nb-text').textContent=nx.text;
    const th=n.steps[n.steps.indexOf(nx)+1];$('nb-then').hidden=!th;if(th)$('nb-then-ico').innerHTML=th.icon}
  if($('ns-eta')){$('ns-eta').textContent=clock(new Date(Date.now()+secs*1000));$('ns-dur').textContent=fmtDur(secs);$('ns-dist').textContent=fmtDist(rem)}
}
async function reroute(){
  const n=nav;if(!n)return;
  n.rerouting=true;toast('Menghitung ulang rute…');
  try{
    const routes=await fetchRoutes(n.dest);if(nav!==n)return;
    const r = routes[0];
    routeLayer.clearLayers();r.line=L.polyline(r.coords,{color:'#1a73e8',weight:7,opacity:.95}).addTo(routeLayer);nav=r;
  }catch(_){if(nav===n){n.off=0;n.rerouting=false}}
}
function arrive(){const d=nav?.dest;endNav(false);toast('Kamu telah tiba di tujuan');if(d)showDetail(d,false)}
function endNav(quiet){
  nav=null;following=false;document.body.classList.remove('navigating');startWatch(false);alignNorth();
  if(!quiet){routeLayer.clearLayers();if(currentPlace)showDetail(currentPlace,false)}
}
map.on('dragstart',()=>{if(nav&&following){following=false;const b=$('btn-recenter');if(b)b.hidden=false}});$('btn-route').onclick=()=>previewRoute(currentPlace);

const sheet=$('sheet'),fabGroup=$('fab-group');
let startY=0,lastY=0,startH=0,dragging=false;
const getSheetMax=()=>mode==='saved'?innerHeight:Math.min(innerHeight*.72,innerHeight-95);
function placeFabs(h){
  if(isDesk())return;
  const topEdge=$('top').getBoundingClientRect().bottom,maxB=Math.max(16,innerHeight-topEdge-12-fabGroup.offsetHeight);
  fabGroup.style.bottom=Math.min(h+16,maxB)+'px';
}
function setSheet(h){
  const max=getSheetMax(),min=nav?110:mode==='saved'?120:SHEET_MIN,safe=Math.min(Math.max(h,min),max);
  sheet.style.height=safe+'px';placeFabs(mode==='saved'?innerHeight:safe);
}
function startDrag(y){if(nav)return;dragging=true;startY=lastY=y;startH=sheet.offsetHeight;sheet.style.transition='none';fabGroup.style.transition='none'}
function moveDrag(y){if(!dragging)return;lastY=y;setSheet(startH+startY-y)}
function endDrag(){
  if(!dragging)return;dragging=false;sheet.style.transition='height .32s cubic-bezier(.2,.8,.2,1)';fabGroup.style.transition='';
  if(mode==='saved'){lastY-startY>100?setMode('explore'):setSheet(innerHeight);return}
  const h=sheet.offsetHeight,max=getSheetMax();
  h<SHEET_INITIAL+20?setSheet(SHEET_INITIAL):h<max*.75?setSheet(Math.min(360,max)):setSheet(max);
}
const handle=$('sheet-handle');
handle.addEventListener('touchstart',e=>startDrag(e.touches[0].clientY),{passive:true});
window.addEventListener('touchmove',e=>{if(dragging){if(e.cancelable)e.preventDefault();moveDrag(e.touches[0].clientY)}},{passive:false});
window.addEventListener('touchend',endDrag);window.addEventListener('touchcancel',endDrag);
handle.addEventListener('mousedown',e=>startDrag(e.clientY));
window.addEventListener('mousemove',e=>moveDrag(e.clientY));window.addEventListener('mouseup',endDrag);
window.addEventListener('resize',()=>setSheet(mode==='saved'?innerHeight:Math.max(sheet.offsetHeight,nav?0:SHEET_MIN)));

window.addEventListener('beforeunload',()=>{
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  if(searchAbort)searchAbort.abort();
  cancelAnimationFrame(raf);
  cancelAnimationFrame(northAnim);
});

map.setMaxBounds(INDONESIA_BOUNDS);map.options.maxBoundsViscosity=1;map.fitBounds(JABODETABEK_BOUNDS,{padding:[20,20],animate:false});map.on('drag',()=>map.panInsideBounds(INDONESIA_BOUNDS,{animate:false}));
resetToWelcome();updateClear();startWatch(false,true);
document.fonts?.ready.then(()=>setSheet(sheet.offsetHeight));

const qs=new URLSearchParams(location.search),qParam=qs.get('q'),pParam=qs.get('p');
if(pParam&&/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(pParam)){
  const[la,lo]=pParam.split(',').map(Number);
  if(validateCoord(la,lo)){
    const pl={name:qs.get('n')||'Lokasi dipilih',lat:la,lon:lo,addr:'',tags:{},place_id:''};
    setTimeout(()=>{addMarker(pl);showDetail(pl)},400);
  }
}else if(qParam){searchInput.value=qParam;updateClear();setTimeout(()=>runSearch(qParam.trim()),600)}
</script>
<script src="/ui-modal.js"></script>
</body>

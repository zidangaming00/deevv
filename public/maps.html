<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Deevv Maps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Google Sans',sans-serif;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#f8f9fa}
#map{position:absolute;inset:0;z-index:1;touch-action:none}
.top-container{position:absolute;top:12px;left:0;right:0;z-index:1000;padding:0 16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.search-wrapper{position:relative;pointer-events:auto}
.search-box{height:52px;background:#fff;border-radius:28px;display:flex;align-items:center;padding:0 10px 0 16px;box-shadow:0 2px 6px rgba(0,0,0,.15);gap:10px}
.search-icon{width:24px;height:24px;fill:#1a73e8;flex-shrink:0}
.search-input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;color:#202124}
.search-input::placeholder{color:#70757a}
.clear-search{width:34px;height:34px;flex-shrink:0;border:none;background:transparent;border-radius:50%;display:none;align-items:center;justify-content:center;color:#5f6368;cursor:pointer;padding:0}
.clear-search:active{background:#f1f3f4}
.clear-search svg{width:20px;height:20px;fill:currentColor}
.suggestions-dropdown{position:absolute;top:58px;left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.18);max-height:260px;overflow-y:auto;display:none;z-index:1001}
.suggestion-item{padding:10px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid #f1f3f4;overflow:hidden}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item svg{width:20px;height:20px;fill:#5f6368;flex-shrink:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.suggestion-info,.result-info{flex:1;min-width:0}
.t1{font-size:14px;font-weight:500;color:#202124}
.t2{font-size:12px;color:#70757a;margin-top:2px}
.chips-wrapper{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px;margin:0 -16px;scrollbar-width:none}
.chips-wrapper::-webkit-scrollbar{display:none}
.chip{background:#fff;border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:500;color:#3c4043;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12);border:1px solid #dadce0;cursor:pointer;flex-shrink:0;transition:transform .12s ease,box-shadow .12s ease}
.chip:active{transform:scale(.96);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.chip svg{width:18px;height:18px;fill:#5f6368;flex-shrink:0}

.fab-group{position:absolute;right:16px;bottom:261px;z-index:1000;display:flex;flex-direction:column;gap:12px;align-items:center;transition:bottom .32s cubic-bezier(.2,.8,.2,1)}
.fab{width:48px;height:48px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 6px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;color:#5f6368;cursor:pointer;transition:transform .12s cubic-bezier(.2,.8,.2,1),box-shadow .12s ease,background .12s ease}
.fab:active,.fab.clicked{transform:scale(.86);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.fab.directions{background:#0b57d0;color:#fff;width:54px;height:54px;border-radius:16px}
.fab.directions:active,.fab.directions.clicked{transform:scale(.90)}
.fab svg{width:24px;height:24px;fill:currentColor;flex-shrink:0}
.fab.clicked svg{transform:scale(.94)}
.fab svg{transition:transform .12s ease}

.bottom-sheet{position:absolute;bottom:0;left:0;right:0;z-index:999;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);height:245px;min-height:205px;display:flex;flex-direction:column;transition:height .32s cubic-bezier(.2,.8,.2,1),border-radius .25s ease;overflow:hidden}
.sheet-handle-area{height:34px;padding:10px 16px 8px;display:flex;align-items:center;justify-content:center;cursor:grab;flex-shrink:0;touch-action:none;position:relative}
.sheet-handle{width:36px;height:4px;background:#dadce0;border-radius:2px}
.panel-close{width:32px;height:32px;border:0;border-radius:50%;background:#f1f3f4;color:#5f6368;display:none;align-items:center;justify-content:center;cursor:pointer;position:absolute;right:16px;top:8px}
.panel-close:active{background:#e8eaed}
.panel-close svg{width:18px;height:18px;fill:currentColor}

.saved-close{width:40px;height:40px;border:0;border-radius:50%;background:#f1f3f4;color:#5f6368;display:none;align-items:center;justify-content:center;cursor:pointer;margin-left:auto}
.saved-close:active{background:#e8eaed;transform:scale(.94)}
.saved-close svg{width:21px;height:21px;fill:currentColor}
.saved-mode{z-index:1100}
.saved-mode .sheet-handle-area{height:58px;padding:10px 16px;justify-content:space-between}
.saved-mode .sheet-handle{opacity:0}
.saved-mode .saved-close{display:flex}
.saved-mode .panel-close{display:none!important}
.saved-mode .sheet-content{padding-top:0}
.saved-mode #sheet-title{font-size:22px;margin-bottom:10px}
.saved-mode .sheet-nav{display:flex}

.sheet-content{flex:1;min-height:0;overflow-y:auto;padding:0 16px 12px;touch-action:pan-y;-webkit-overflow-scrolling:touch;transition:opacity .18s ease,transform .25s ease}
#sheet-title{font-size:18px;font-weight:700;color:#202124;margin-bottom:4px;padding-right:32px}
.hint{font-size:13px;color:#5f6368;line-height:1.5}
.welcome-card{padding:16px;border:1px solid #e8eaed;border-radius:18px;background:linear-gradient(135deg,#f8fbff,#fff);box-shadow:0 2px 8px rgba(60,64,67,.08);margin-bottom:12px}
.welcome-top{display:flex;align-items:center;gap:12px}
.welcome-icon{width:42px;height:42px;border-radius:14px;background:#e8f0fe;color:#0b57d0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.welcome-greeting{font-size:17px;font-weight:700;color:#202124}
.welcome-date{font-size:12px;color:#70757a;margin-top:3px}
.welcome-text{font-size:13px;line-height:1.5;color:#5f6368;margin-top:12px}
.result-item{padding:12px 0;border-bottom:1px solid #f1f3f4;cursor:pointer;display:flex;align-items:center;gap:12px}
.result-item:active{background:#f8f9fa}
.result-item svg{width:20px;height:20px;fill:#5f6368;flex-shrink:0}
.dist{font-size:12px;color:#1a73e8;font-weight:500;flex-shrink:0}
.photo{width:100%;height:170px;object-fit:cover;border-radius:12px;margin:8px 0}
.row{font-size:13px;color:#3c4043;padding:6px 0;line-height:1.4;word-break:break-word}
.row b{color:#5f6368;font-weight:500}
.row a{color:#1a73e8;text-decoration:none}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid #dadce0;background:#fff;color:#1a73e8;border-radius:20px;padding:8px 16px;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s ease,background .12s ease}
.btn:active{transform:scale(.96)}
.btn.primary{background:#0b57d0;color:#fff;border-color:#0b57d0}
.btn.danger{background:#d93025;color:#fff;border-color:#d93025}
.btn.saved{background:#e8f0fe;color:#0b57d0;border-color:#aecbfa}
.save-btn-icon{width:18px;height:18px;fill:currentColor;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.saved-empty{text-align:center;padding:24px 10px 12px}
.saved-empty-icon{width:56px;height:56px;border-radius:50%;background:#f1f3f4;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.saved-empty-icon svg{width:28px;height:28px;fill:#5f6368}
.saved-empty-title{font-size:16px;font-weight:600;color:#202124;margin-bottom:5px}

.saved-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f1f3f4;cursor:pointer;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .3s cubic-bezier(.4,0,.2,1);overflow:hidden;opacity:1;transform:translateX(0)}
.saved-item:active{background:#f8f9fa}
.saved-item.removing{opacity:0;transform:translateX(100%)}
.saved-pin{width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#e8f0fe;color:#1a73e8;display:flex;align-items:center;justify-content:center}
.saved-pin svg{width:20px;height:20px;fill:currentColor}
.saved-info{flex:1;min-width:0}
.saved-name{font-size:14px;font-weight:600;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-address{margin-top:3px;font-size:12px;color:#70757a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-remove{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#5f6368;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.saved-remove:active{background:#f1f3f4;transform:scale(.92)}
.saved-remove svg{width:20px;height:20px;fill:currentColor}

.sheet-nav{height:64px;flex-shrink:0;border-top:1px solid #f1f3f4;background:#fff;display:flex;align-items:center;justify-content:space-around;padding:4px 18px env(safe-area-inset-bottom,4px)}
.sheet-tab{border:none;background:transparent;color:#5f6368;min-width:90px;height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;cursor:pointer;transition:transform .12s ease,background .15s ease,color .15s ease}
.sheet-tab:active{transform:scale(.95)}
.sheet-tab svg{width:22px;height:22px;fill:currentColor;display:block}
.sheet-tab.active{color:#0b57d0;background:#e8f0fe;font-weight:700}
.user-dot{width:18px;height:18px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,.4)}

.location-fallback{padding:14px;border:1px solid #e8eaed;border-radius:16px;background:#fff;margin-bottom:12px}
.location-fallback-title{font-size:14px;font-weight:700;color:#202124;margin-bottom:5px}
.location-fallback-text{font-size:12.5px;color:#5f6368;line-height:1.5}
.location-fallback .btn{margin-top:10px}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .2s cubic-bezier(.2,0,0,1)}
.modal-overlay.active{display:flex;opacity:1}
.modal-box{background:#fff;border-radius:24px;width:100%;max-width:320px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.2);transform:scale(.95);transition:transform .2s cubic-bezier(.2,0,0,1)}
.modal-overlay.active .modal-box{transform:scale(1)}
.modal-title{font-size:18px;font-weight:700;color:#202124;margin-bottom:8px}
.modal-desc{font-size:14px;color:#5f6368;line-height:1.4;margin-bottom:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.modal-btn{border:none;background:transparent;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:500;cursor:pointer}
.modal-btn.cancel{color:#5f6368}
.modal-btn.cancel:active{background:#f1f3f4}
.modal-btn.delete{color:#b3261e;background:#fce8e6;font-weight:700}
.modal-btn.delete:active{background:#f9dedc}
.nav-badge{display:inline-block;padding:3px 8px;background:#e6f4ea;color:#137333;font-weight:700;border-radius:12px;font-size:11px;margin-bottom:6px}

@keyframes panelFadeOut{
from{opacity:1;transform:translateY(0)}
to{opacity:0;transform:translateY(5px)}
}
@keyframes panelFadeIn{
from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:translateY(0)}
}
.sheet-content.switching-out{animation:panelFadeOut .14s ease forwards}
.sheet-content.switching-in{animation:panelFadeIn .2s ease forwards}
</style>
</head>
<body>

<div class="top-container" id="top-container">
<div class="search-wrapper">
<div class="search-box">
<svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
<input type="text" id="search-input" class="search-input" placeholder="Telusuri di sini" autocomplete="off" enterkeyhint="search">
<button class="clear-search" id="clear-search" aria-label="Hapus pencarian">
<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
</button>
</div>
<div class="suggestions-dropdown" id="suggestions"></div>
</div>

<div class="chips-wrapper">
<div class="chip" data-cat="Restoran"><svg viewBox="0 0 24 24"><path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.46 3.9 3.45 4.38V21h2.1v-7.62C10.54 12.9 12 11.12 12 9V2h-1v7zm7-7h-2v19h2v-8h2V2h-2z"/></svg>Restoran</div>
<div class="chip" data-cat="Hotel"><svg viewBox="0 0 24 24"><path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/></svg>Hotel</div>
<div class="chip" data-cat="Kedai Kopi"><svg viewBox="0 0 24 24"><path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-4 4-4v-3h2c1.11 0 2-.89 2-2V5c0-1.11-.89-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/></svg>Kedai Kopi</div>
<div class="chip" data-cat="SPBU"><svg viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2v-5h1v5.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V10.5c0-.85-.43-1.61-1.23-2.27zM11 10H5V5h6v5z"/></svg>SPBU</div>
</div>
</div>

<div class="fab-group" id="fab-group">
<button class="fab" title="Ubah layer peta" id="btn-layer"><svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9l-9-7-9 7 1.63 1.27L12 16z"/></svg></button>
<button class="fab" title="Kembali menghadap utara" id="btn-north"><svg id="compass-icon" viewBox="0 0 24 24" style="transition:transform .1s linear"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/><polygon points="12,4 15,12 12,10" fill="#ea4335"/><polygon points="12,4 9,12 12,10" fill="#cc2515"/><polygon points="12,20 15,12 12,14" fill="#9aa0a6"/><polygon points="12,20 9,12 12,14" fill="#5f6368"/></svg></button>
<button class="fab" title="Lokasi saya" id="btn-me" style="color:#1a73e8"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-7.94 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>
<button class="fab directions" title="Rute ke tempat terpilih" id="btn-route"><svg viewBox="0 0 24 24"><path d="M22.43 10.59l-9.01-9.01c-.75-.75-2.07-1.32-2.83 0l-9 9c-.78.78-.78 2.04 0 2.82l9 9c.39.39.9.58 1.41.58.51 0 1.02-.19 1.41-.58l8.99-8.99c.79-.76.79-2.03.03-2.82zM13 14.5V12h-4v3H7v-5c0-.55.45-1 1-1h5V6.5l3.5 3.5-3.5 3.5z"/></svg></button>
</div>

<div class="bottom-sheet" id="sheet">
<div class="sheet-handle-area" id="sheet-handle">
<div class="sheet-handle"></div>
<button class="panel-close" id="panel-close" aria-label="Tutup Detail" title="Kembali">
<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
</button>
<button class="saved-close" id="saved-close" aria-label="Tutup Tersimpan">
<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
</button>
</div>

<div class="sheet-content" id="sheet-content">
<div id="sheet-title">Suasana lokal</div>
<div id="sheet-detail"></div>
</div>

<nav class="sheet-nav">
<button class="sheet-tab active" id="tab-explore">
<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-.32.04-.65.07-1 .07-4.41 0-8-3.59-8-8 0-.35.03-.68.07-1H7v2.5c0 .83.67 1.5 1.5 1.5H11v2.93zM17 17.5c0 .28-.22.5-.5.5H15v-2.5c0-.83-.67-1.5-1.5-1.5H11v-3h2.5c.83 0 1.5-.67 1.5-1.5V7h2v10.5z"/></svg>

<button class="modal-btn cancel" id="btn-modal-cancel">Batal</button>

</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js"></script>
<script>
const DEFAULT=[-6.30,106.82];
const JABODETABEK_BOUNDS=[
[-6.95,106.45],
[-5.85,107.35]
];
const RADIUS=3000;

let userCoords=DEFAULT.slice();
let located=false;
let locationDenied=false;
let currentPlace=null;
let searchTimer=null;
let pendingDeleteKey=null;
let watchId=null;
let isNavigating=false;
let savedMode=false;
let closingSaved=false;

const map=L.map('map',{
zoomControl:false,
attributionControl:false,
rotate:true,
touchRotate:true,
rotateControl:false,
bearing:0,
center:DEFAULT,
zoom:10
});

const roadmap=L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{
maxZoom:20,
subdomains:['mt0','mt1','mt2','mt3']
});

const satellite=L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',{
maxZoom:20,
subdomains:['mt0','mt1','mt2','mt3']
});

roadmap.addTo(map);

const markers=L.layerGroup().addTo(map);
const routeLayer=L.layerGroup().addTo(map);
let userMarker=null;

const $=id=>document.getElementById(id);

const esc=s=>String(s).replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));

const origin=()=>located?userCoords:[map.getCenter().lat,map.getCenter().lng];

const fmtDist=m=>m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km';

const PIN=`<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`;

const SAVED_KEY='deevv_maps_saved_places';

function getSaved(){
try{
const data=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');
return Array.isArray(data)?data:[];
}catch(_){
return[];
}
}

function saveSaved(list){
localStorage.setItem(SAVED_KEY,JSON.stringify(list));
}

function placeKey(p){
if(!p)return'';
if(p.place_id)return'place:'+p.place_id;
return'coord:'+Number(p.lat).toFixed(6)+','+Number(p.lon).toFixed(6);
}

function isSaved(p){
return getSaved().some(x=>placeKey(x)===placeKey(p));
}

function toggleSaved(p){
if(!p)return false;

const list=getSaved();
const key=placeKey(p);
const index=list.findIndex(x=>placeKey(x)===key);

if(index>=0){
list.splice(index,1);
saveSaved(list);
return false;
}

list.unshift({
name:p.name||'Tempat tanpa nama',
lat:Number(p.lat),
lon:Number(p.lon),
addr:p.addr||'',
tags:p.tags||{},
place_id:p.place_id||''
});

saveSaved(list.slice(0,100));
return true;
}

function updateUserLocation(coords,heading=null){
userCoords=[coords.latitude,coords.longitude];
located=true;
locationDenied=false;

if(userMarker){
userMarker.setLatLng(userCoords);
}else{
userMarker=L.marker(userCoords,{
icon:L.divIcon({
className:'',
html:'<div class="user-dot"></div>',
iconSize:[18,18],

map.panTo(userCoords);

}
}
}

let northAnim=null;

function alignNorth(){
cancelAnimationFrame(northAnim);

const from=map.getBearing();
const delta=((-from+540)%360)-180;

if(Math.abs(delta)<.5){
map.setBearing(0);
return;
}

const dur=450;
const t0=performance.now();

const step=now=>{
const p=Math.min(1,(now-t0)/dur);
const ease=1-Math.pow(1-p,3);

map.setBearing(p<1?from+delta*ease:0);

if(p<1)northAnim=requestAnimationFrame(step);
};

northAnim=requestAnimationFrame(step);
}

$('btn-north').onclick=alignNorth;

map.getContainer().addEventListener('touchstart',()=>cancelAnimationFrame(northAnim),{passive:true});

const OVERPASS_ENDPOINTS=[
'https://overpass-api.de/api/interpreter',
'https://overpass.kumi.systems/api/interpreter',
'https://overpass.private.coffee/api/interpreter'
];

function fromOverpass(el){
const t=el.tags||{};
const lat=el.lat??el.center?.lat;
const lon=el.lon??el.center?.lon;

if(lat==null||lon==null||!t.name)return null;

const addr=[
t['addr:housenumber'],
t['addr:street'],
t['addr:suburb']||t['addr:village']||t['addr:town']||t['addr:city']
].filter(Boolean).join(', ');

return{
name:t.name,
lat:Number(lat),
lon:Number(lon),
tags:t,
addr:addr||t['addr:full']||'',
place_id:el.id?`osm_${el.type||'node'}_${el.id}`:''
};
}

async function fetchOverpass(query){
let lastError=null;

for(const endpoint of OVERPASS_ENDPOINTS){
try{
const controller=new AbortController();
const timer=setTimeout(()=>controller.abort(),25000);

const res=await fetch(endpoint,{
method:'POST',
headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
body:'data='+encodeURIComponent(query),
signal:controller.signal
});

clearTimeout(timer);

if(!res.ok){
lastError=new Error('HTTP '+res.status);
continue;
}

const data=await res.json();

if(data&&Array.isArray(data.elements)){
return data.elements;
}

lastError=new Error('Invalid Overpass response');
}catch(e){
lastError=e;
}
}

throw lastError||new Error('Overpass unavailable');
}

async function searchNearby(key){
const cat=CATS[key];

if(!cat){
return;
}

const[lat,lon]=origin();

$('search-input').value=cat.label;
updateClearButton();
$('suggestions').style.display='none';

if(savedMode){
savedMode=false;
closingSaved=false;
$('sheet').classList.remove('saved-mode');
$('tab-saved').classList.remove('active');
$('tab-explore').classList.add('active');
}

$('panel-close').style.display='flex';
$('sheet-title').textContent=cat.label+' terdekat';
$('sheet-detail').innerHTML='<div class="hint">Mencari tempat di sekitar kamu...</div>';

setSheet(300);
routeLayer.clearLayers();

const filters=cat.filters.map(f=>`nwr${f}["name"](around:${RADIUS},${lat},${lon});`).join('');
const q=`[out:json][timeout:25];(${filters});out center tags;`;

try{
const elements=await fetchOverpass(q);

const seen=new Set();

const places=elements
.map(fromOverpass)
.filter(Boolean)
.filter(p=>{
const key=placeKey(p);
if(seen.has(key))return false;
seen.add(key);
return true;
})
.map(p=>({...p,d:map.distance([lat,lon],[p.lat,p.lon])}))
.sort((a,b)=>a.d-b.d)
.slice(0,30);

if(!places.length){
$('sheet-detail').innerHTML=`
<div class="hint">
Tidak ada ${esc(cat.label.toLowerCase())} terdata dalam radius ${RADIUS/1000} km dari posisi ini.
<br><br>
Coba aktifkan lokasi atau geser peta ke area lain lalu tekan ${esc(cat.label)} lagi.
</div>`;
return;
}

showList(places,cat.label);

}catch(e){
console.error('Overpass error:',e);

$('sheet-detail').innerHTML=`
<div class="hint" style="color:#ea4335">
Layanan data tempat sedang tidak merespons.
</div>
<div class="btns">
<button class="btn primary" id="retry-category">Coba lagi</button>
</div>
`;

$('retry-category').onclick=()=>searchNearby(key);
}
}

function fromNominatim(it){
const name=it.name||it.display_name.split(',')[0];

return{
name,
lat:parseFloat(it.lat),
lon:parseFloat(it.lon),
tags:it.extratags||{},
addr:it.display_name,
place_id:it.place_id?`nom_${it.place_id}`:''
};
}

async function nominatim(q,limit){
const[lat,lon]=origin();
const d=.3;

const url=`https://nominatim.openstreetmap.org/search?format=json&extratags=1&limit=${limit}&countrycodes=id&q=${encodeURIComponent(q)}&viewbox=${lon-d},${lat+d},${lon+d},${lat-d}&bounded=0`;

const res=await fetch(url,{
headers:{Accept:'application/json'}
});

if(!res.ok)throw new Error(res.status);

return(await res.json()).map(fromNominatim);
}

function photoUrl(t){
if(t.image&&/^https?:\/\//.test(t.image))return t.image;

const wc=t.wikimedia_commons;

if(wc&&wc.startsWith('File:')){
return'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(wc.slice(5))+'?width=700';
}

return null;
}

map.flyTo([p.lat,p.lon],Math.max(map.getZoom(),17));

const[lat,lon]=origin();

const photo=photoUrl(t);
const web=t.website||t['contact:website'];
const phone=t.phone||t['contact:phone'];
const saved=isSaved(p);

if(photo){
h+=`<img class="photo" src="${esc(photo)}" alt="" onerror="this.remove()">`;

if(web&&/^https?:\/\//.test(web)){

<div class="location-fallback-text">Aktifkan izin lokasi agar rute dapat dihitung dari posisi kamu.</div>
<button class="btn primary" id="btn-route-location">Aktifkan lokasi</button>
</div>`;

$('btn-route-location').onclick=()=>requestLocation(true);
setSheet(300);
return;
}

try{
const url=`https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${p.lon},${p.lat}?overview=full&geometries=geojson`;
const r=await(await fetch(url)).json();

if(!r.routes||!r.routes.length)throw new Error('no route');

const rt=r.routes[0];

routeLayer.clearLayers();

const line=L.geoJSON(rt.geometry,{
style:{color:'#1a73e8',weight:6,opacity:.85}
}).addTo(routeLayer);

map.fitBounds(line.getBounds().pad(.2));

const mins=Math.round(rt.duration/60);

$('panel-close').style.display='flex';
$('sheet-title').textContent=`${fmtDist(rt.distance)} · ${mins>=60?Math.floor(mins/60)+' j '+(mins%60)+' mnt':mins+' mnt'}`;

$('sheet-detail').innerHTML=`
<div class="hint" style="margin-bottom:10px">Rute mobil menuju <b>${esc(p.name)}</b>.</div>
<div class="btns">
<button class="btn primary" id="btn-start-nav">▶ Mulai Navigasi</button>
</div>`;

$('btn-start-nav').onclick=()=>startLiveNavigation(p);
setSheet(230);

}catch(_){
alert('Rute tidak dapat dihitung saat ini.');
}
}

function startLiveNavigation(destination){
isNavigating=true;
map.setZoom(18);

if(navigator.geolocation){
watchId=navigator.geolocation.watchPosition(
pos=>{
updateUserLocation(pos.coords,pos.coords.heading);

const distRemaining=map.distance(
[pos.coords.latitude,pos.coords.longitude],
[destination.lat,destination.lon]
);

$('sheet-title').innerHTML=`<span class="nav-badge">BERJALAN</span> ${fmtDist(distRemaining)}`;

$('sheet-detail').innerHTML=`
<div class="hint">Navigasi aktif ke <b>${esc(destination.name)}</b>. Peta mengunci posisi kamu secara langsung.</div>
<div class="btns" style="margin-top:10px">
<button class="btn danger" onclick="stopLiveNavigation();routeTo(currentPlace)">Selesai</button>
</div>`;
},
()=>{},
{enableHighAccuracy:true,maximumAge:1000,timeout:5000}
);
}
}

$('btn-route').onclick=()=>routeTo(currentPlace);

const sheet=$('sheet');
const fabGroup=$('fab-group');

let startY=0;
let lastY=0;
let startH=0;
let dragging=false;

const SHEET_MIN=205;
const SHEET_INITIAL=245;

function getSheetMax(){
return savedMode
?window.innerHeight
:Math.min(window.innerHeight*.72,window.innerHeight-95);
}

function setSheet(h){
const max=getSheetMax();
const min=savedMode?120:SHEET_MIN;

const safe=Math.min(
Math.max(h,min),
max
);

sheet.style.height=safe+'px';

if(savedMode){
fabGroup.style.bottom=(window.innerHeight+16)+'px';
}else{
fabGroup.style.bottom=(safe+16)+'px';
}
}

function startDrag(y){
dragging=true;
startY=y;
lastY=y;
startH=sheet.offsetHeight;
sheet.style.transition='none';
}

function moveDrag(y){
if(!dragging)return;

lastY=y;
setSheet(startH+startY-y);
}

function endDrag(){
if(!dragging)return;

dragging=false;

sheet.style.transition='height .32s cubic-bezier(.2,.8,.2,1)';

if(savedMode){
if(lastY-startY>100){
showExplore();
}else{
setSheet(window.innerHeight);
}
return;
}

const h=sheet.offsetHeight;
const max=getSheetMax();

if(h<275){
setSheet(SHEET_INITIAL);
}else if(h<max*.75){
setSheet(Math.min(340,max));
}else{
setSheet(max);
}
}

const handle=$('sheet-handle');

handle.addEventListener('touchstart',e=>{
startDrag(e.touches[0].clientY);
},{passive:true});

window.addEventListener('touchmove',e=>{
if(dragging){
e.preventDefault();
moveDrag(e.touches[0].clientY);
}
},{passive:false});

window.addEventListener('touchend',endDrag);

handle.addEventListener('mousedown',e=>{
startDrag(e.clientY);
});

window.addEventListener('mousemove',e=>{
moveDrag(e.clientY);
});

window.addEventListener('mouseup',endDrag);

window.addEventListener('resize',()=>{
if(savedMode){
setSheet(window.innerHeight);
}else{
setSheet(Math.max(sheet.offsetHeight,SHEET_MIN));
}
});

function initializeMapView(){
map.fitBounds(JABODETABEK_BOUNDS,{
padding:[20,20],
animate:false
});
}

initializeMapView();
resetToWelcome();
updateClearButton();
</script>
